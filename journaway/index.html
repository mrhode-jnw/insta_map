body.dock-off #dock, body.dock-off #dockTab, body.dock-off #dockbg { display: none !important; }

  /* Reise-Infos */
  #setBody .srow input[type=date] { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font: inherit; background: #fff; color: var(--fg); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<script src="data/trip.js"></script>

<script>
  // iOS ignoriert user-scalable=no: Seiten-Zoom per Zwei-Finger-Geste außerhalb der Karte unterbinden
  document.addEventListener("gesturestart", e => { if (!e.target.closest || !e.target.closest("#map")) e.preventDefault(); }, { passive: false });
</script>
<script>
function startApp() {
  const places = (window.PLACES || []).filter(p => isFinite(p.lat) && isFinite(p.lng));
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const ITIN = window.ITINERARY || { days: [], hotels: {} };
  const TRIPI = window.TRIP;
  const GMAP = false, ROTATE = false;
  // Desktop (Maus/Trackpad): ohne Zoom-Animation, sonst laufen Pins beim Zoomen auseinander
  const fineMouse = window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches;
  const map = L.map("map", { zoomControl: false, tap: true, tapHold: true, maxZoom: 19,
    ...(fineMouse ? { zoomAnimation: false, markerZoomAnimation: false, wheelPxPerZoomLevel: 120 } : {}) }).setView([35.4, 137.5], 6);
  L.control.zoom({ position: "topright" }).addTo(map);
  // Maßstab (funktioniert für Leaflet und Google gleich: Web-Mercator, 256-px-Kacheln)
  const drawScale = () => { try {
    const c = map.getCenter(), mpp = 156543.03392 * Math.cos(c.lat * Math.PI / 180) / Math.pow(2, map.getZoom());
    const max = 90 * mpp, p = Math.pow(10, Math.floor(Math.log10(max))), d = max / p;
    const m = (d >= 5 ? 5 : d >= 2 ? 2 : 1) * p, el = document.getElementById("scale");
    el.querySelector("b").textContent = m >= 1000 ? m / 1000 + " km" : m + " m";
    el.querySelector("span").style.width = Math.round(m / mpp) + "px";
  } catch {} };
  map.on("zoomend", drawScale); map.on("moveend", drawScale); setTimeout(drawScale, 0);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  // ---------- Marker
  const cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 24, removeOutsideVisibleBounds: false });  // klein: Pins (34 px) bleiben einzeln, bis sie sich zu ca. 1/3 überdecken
  const markers = new Map();
  let me = null, nearSpots = false;
  // Entfernungen nur zeigen, wenn man vor Ort ist (nächster Spot < 50 km) – von zu Hause aus sind sie sinnlos
  const here = () => !!me && nearSpots;
  let order = [];  // aktuelle Listen-Reihenfolge (Filter + Sortierung) für ‹ › im Popup
  // ‹ › blättern durch genau die Spots der Liste (Filter + Sortierung, „n Orte“ bzw. „n sichtbar“)
  let navFor = null, stepping = false;
  let sheetSnap = "peek";
  const dist = (a, b) => {
    const R = 6371e3, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };
  const fmt = m => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)} km`;
  // Navigation durch die Liste (‹ ›)
  let navSnap = null;
  const navOrder = cur => { navFor = cur; const o = navSnap && navSnap.includes(cur) ? navSnap : order;
    return o.includes(cur) ? o.slice() : [cur, ...o]; };

  const KIND = { sight: ["⛩️", "Sehenswert"], food: ["🍜", "Essen"], shop: ["🛍️", "Shopping"], view: ["🌇", "Aussicht"], night: ["🌃", "Abends"] };
  // Tag(e) im Reiseplan, an denen ein Spot vorkommt (Programm) bzw. vorgeschlagen wird (Empfehlung)
  const PLAN_AT = {}, ORD = {};
  { let k = 0;
    ITIN.days.forEach(d => d.items.forEach(it => { if (it.type !== "stop") return;
      if (!(it.spot in ORD)) ORD[it.spot] = k++;
      if (!PLAN_AT[it.spot]) PLAN_AT[it.spot] = { n: d.n, t: it.t || "", plan: !!it.plan, short: "Tag " + d.n,
        long: (it.plan ? "★ Reiseprogramm · Tag " : "✦ Empfehlung · Tag ") + d.n + (it.t ? " · " + it.t : "") }; })); }
  function popupHtml(p) {
    const nav = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
    const navIds = navOrder(p.id), idx = navIds.indexOf(p.id);
    const multi = idx >= 0 && navIds.length > 1;
    const pnav = `<div class="pnav">
        <button class="pclose" aria-label="Schließen">✕</button>
        ${multi ? `<button data-go="-1" aria-label="Vorheriger Spot">‹</button>` : ""}
        ${multi ? `<span class="spotnum" title="Spots der Liste">📍 Spot ${idx + 1} von ${navIds.length}</span>` : `<span></span>`}
        ${multi ? `<button data-go="1" aria-label="Nächster Spot">›</button>` : ""}
        <button class="pmini" data-mini="${esc(p.id)}" aria-label="Klein – Spot auf der Karte zeigen" title="Klein – Spot auf der Karte zeigen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg></button></div>`;
    const k = KIND[p.kind] || KIND.sight;
    return `<div class="pop">${pnav}
      <div class="b">
        ${PLAN_AT[p.id] ? `<div class="kick">${esc(PLAN_AT[p.id].long)}</div>` : ""}
        <h3>${esc(p.name)}</h3>
        <div class="mline"><span>${k[0]} ${k[1]}</span><span>${esc(p.district)}</span>${here() ? `<span>📍 ${fmt(dist(me, p))}</span>` : ""}</div>
        <div class="status sv2" data-id="${esc(p.id)}">
          <div class="actB">
            <a class="go" href="${nav}" target="_blank" rel="noopener">➤ Navigieren</a>
          </div>
        </div>
        ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
      </div></div>`;
  }
  function iconFor(p) {
    const tag = PLAN_AT[p.id] ? `<span class="ptag">${esc(PLAN_AT[p.id].short)}</span>` : "";
    return L.divIcon({ className: "", iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -18],
      html: `<div class="pin jw ${p.by_claude ? "tipp" : "prog"}">${(KIND[p.kind] || KIND.sight)[0]}${tag}</div>` });
  }
  function addMarker(p) {
    const m = L.marker([p.lat, p.lng], { icon: iconFor(p), title: p.name });
    m.bindPopup(() => popupHtml(p), { maxWidth: 400, maxHeight: Math.round(window.innerHeight * 0.62),
      autoPan: window.innerWidth >= 800,  // Handy: Spot als feste Karte, die Karte im Hintergrund bleibt stehen
      autoPanPaddingTopLeft: [10, 78], autoPanPaddingBottomRight: [10, 90] });
    // Beim Zoomen verschwindet der Pin evtl. in einer Gruppe – der geöffnete Spot soll trotzdem offen bleiben
    m.off("remove", m.closePopup, m);
    markers.set(p.id, m);
  }
  places.forEach(addMarker);
  map.addLayer(cluster);
  // ---------- Reiseroute (Tokyo → Kyoto → Osaka) und Unterkünfte
  const ROUTE = TRIPI.route;
  const routeLayer = L.layerGroup([
    L.polyline(ROUTE.map(r => [r.lat, r.lng]), { color: "#4dc6d3", weight: 3, opacity: .7, dashArray: "6 8", interactive: false }),
    ...ROUTE.map(r => L.circleMarker([r.lat, r.lng], { radius: 6, color: "#fff", weight: 2, fillColor: "#1f0e32", fillOpacity: 1 })
      .bindTooltip(`${r.d} · ${r.name}`, { direction: "top", offset: [0, -6] })),
  ]).addTo(map);
  const HOTELS = TRIPI.hotels;
  const hotelIcon = L.divIcon({ className: "", iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -12],
    html: '<div class="hotel-pin" title="Hotel">🏨</div>' });
  const farZoom = () => map.getContainer().classList.toggle("zoom-far", map.getZoom() < 10);
  map.on("zoomend", farZoom); farZoom();
  HOTELS.forEach(H => L.marker([H.lat, H.lng], { icon: hotelIcon, zIndexOffset: -500, title: H.name }).addTo(map)
    .bindPopup(() => `<div class="pop"><div class="pnav"><button class="pclose" aria-label="Schließen">✕</button><span>Dein Hotel</span><span style="width:38px"></span></div>
      <div class="b"><h3>🏨 ${esc(H.name)}</h3><div class="meta">${esc(H.address)}</div>
        <div class="note">${esc(H.dates)}</div>
        ${H.approx ? `<div class="approx">Pin ungefähr</div>` : ""}
        <div class="links"><a href="https://www.google.com/maps/dir/?api=1&destination=${H.lat},${H.lng}" target="_blank" rel="noopener">Route</a>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(H.name)}" target="_blank" rel="noopener">In Google Maps</a></div>
      </div></div>`, { maxWidth: 400, autoPan: window.innerWidth >= 800 }));

  // ---------- Filter: Reiseprogramm / Empfehlungen, Stadt, Suche
  let group = "all";  // all | prog | tips
  const inGroup = p => group === "all" || (group === "tips") === !!p.by_claude;
  const areaOf = p => p.district || "Sonstige";
  let areaF = "";
  let view = "list", inView = true;
  const fitRegion = () => map.fitBounds(L.latLngBounds(places.map(p => [p.lat, p.lng])), { padding: [40, 40], animate: false });
  $("#group").addEventListener("click", e => {
    const b = e.target.closest("button[data-g]"); if (!b) return;
    group = b.dataset.g; renderList();
  });
  $("#area").addEventListener("change", e => { areaF = e.target.value; renderList(); });
  $("#view").addEventListener("click", e => {
    const b = e.target.closest("button[data-v=area]"); if (!b) return;
    inView = !inView; toast(inView ? "Nur Spots im Kartenausschnitt" : "Alle Spots", 1500); renderList();
  });
  // Der gerade geöffnete Spot bleibt sichtbar, auch wenn er nicht (mehr) zum Filter passt
  let stickyId = null;
  const filtersActive = () => !!(group !== "all" || areaF || $("#search").value.trim() || inView);
  const syncFilterSw = () => { const b = $("#filterSw"); if (b) b.disabled = !filtersActive(); };
  $("#filterSw").addEventListener("click", () => {
    group = "all"; areaF = ""; $("#search").value = ""; inView = false; renderList();
  });
  const matches = p => p.id === stickyId || matchesFilter(p);
  const matchesFilter = p => {
    const q = $("#search").value.trim().toLowerCase();
    const hay = [p.name, p.district, p.note, (KIND[p.kind] || [])[1]].join(" ").toLowerCase();
    return inGroup(p) && (!q || hay.includes(q)) && (!areaF || areaOf(p) === areaF);
  };
  const shown = new Set();
  // Zum Marker zoomen und Popup öffnen – erst wenn die Cluster-Neuberechnung nach dem Zoom durch ist
  let focusToken = 0;
  function focusMarker(m, tries = 0) {
    if (!m) return;
    const tok = tries ? focusToken : ++focusToken;

    });
    const top = el.scrollTop; el.replaceChildren(...next); el.scrollTop = top;
  }
  $("#list").addEventListener("click", e => {
    const li = e.target.closest("li[data-id]"); if (!li) return;
    if (!map._popup || !map.hasLayer(map._popup)) saveView();
    const m = markers.get(li.dataset.id);
    openSpot(m);  // Liste bleibt wie sie ist – nach dem Schließen ist man wieder genau dort
  });
  // Desktop: Spot in der Liste überfahren → Pin (oder seine Gruppe) auf der Karte hervorheben
  let hlEl = null;
  const unHl = () => { if (hlEl) { hlEl.classList.remove("hl"); hlEl = null; } };
  $("#list").addEventListener("mouseover", e => {
    const li = e.target.closest("li[data-id]"); if (!li) return unHl();
    const m = markers.get(li.dataset.id); if (!m) return;
    const vis = cluster.getVisibleParent(m), el = vis && vis.getElement && vis.getElement();
    if (el === hlEl) return;
    unHl(); if (el) { hlEl = el; el.classList.add("hl"); }
  });
  $("#list").addEventListener("mouseleave", unHl);
  $("#search").addEventListener("input", renderList);
  $("#search").addEventListener("focus", () => { if (sheetSnap === "peek") setSnap("half"); });
  // ---------- Bottom-Sheet ziehen (Handy): Stufen eingeklappt / halb / voll
  const sheet = $("#sheet"), head = $("#sheetHead"), listEl = $("#list");
  const mobile = () => window.innerWidth < 800;
  const ORDER = ["full", "half", "peek"];
  function snapY(name) {
    const H = sheet.offsetHeight, row = head.querySelector(".row");
    const pad = parseFloat(getComputedStyle(sheet).paddingBottom) || 0;
    const peek = head.offsetTop + row.offsetTop + row.offsetHeight + 12 + pad;
    return { full: 0, half: Math.max(0, H - Math.round(window.innerHeight * 0.55)), peek: Math.max(0, H - peek) }[name];
  }
  function moveTo(y, animate) {
    sheet.style.transition = animate ? "" : "none";
    sheet.style.transform = `translateY(${y}px)`;
    // entweder Liste offen oder Leiste – nach der tatsächlichen Höhe der Liste (auch beim Ziehen)
    try { document.body.classList.toggle("dock-auto", mobile() && y < snapY("peek") - 30); } catch {}
  }
  // Nach dem Öffnen/Verschieben der Übersicht keine Klicks auf die Liste annehmen: der „Nach-Klick“ vom Antippen/Hochziehen
  // (iOS) landet sonst auf dem Spot, der gerade unter dem Finger liegt, und öffnet ihn ungewollt als Karte
  let snapAt = 0;
  sheet.addEventListener("click", e => { if (performance.now() - snapAt < 700 && e.target.closest("#list")) { e.stopPropagation(); e.preventDefault(); } }, true);
  function setSnap(name, animate = true) {
    snapAt = performance.now(); sheetSnap = name;
    if (!mobile()) { sheet.style.transform = ""; return; }
    moveTo(snapY(name), animate);
  }
  function release(y, v) {  // v: px/ms, positiv = nach unten
    const ys = ORDER.map(n => [n, snapY(n)]);
    let target;
    if (v > 0.45) target = (ys.filter(([, sy]) => sy > y + 4).sort((a, b) => a[1] - b[1])[0] || ys[2])[0];
    else if (v < -0.45) target = (ys.filter(([, sy]) => sy < y - 4).sort((a, b) => b[1] - a[1])[0] || ys[0])[0];
    else target = ys.reduce((a, b) => Math.abs(b[1] - y) < Math.abs(a[1] - y) ? b : a)[0];
    setSnap(target);
  }
  function tracker(y0, base) {
    let last = y0, lastT = performance.now(), v = 0, y = base;
    return {
      move(cy) {
        const now = performance.now();
        v = 0.7 * ((cy - last) / Math.max(1, now - lastT)) + 0.3 * v; last = cy; lastT = now;
        y = Math.min(Math.max(base + (cy - y0), 0), snapY("peek"));
        moveTo(y, false);
        return y;
      },
      end() { release(y, performance.now() - lastT > 120 ? 0 : v); }
    };
  }
  // Ziehen am Kopfbereich (Griff, Suchzeile, Leerräume)
  let hd = null;
  head.addEventListener("pointerdown", e => {
    if (!mobile() || e.button > 0 || e.target.closest("button, input, select, #chips, #chips2")) return;
    hd = { y0: e.clientY, moved: false, t: tracker(e.clientY, snapY(sheetSnap)) };
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener("pointermove", e => {
    if (!hd) return;
    if (Math.abs(e.clientY - hd.y0) > 6) hd.moved = true;
    if (hd.moved) hd.t.move(e.clientY);
  });
  const headEnd = () => {
    if (!hd) return;
    snapAt = performance.now();
    if (hd.moved) hd.t.end(); else setSnap(sheetSnap === "peek" ? "half" : "peek");
    hd = null;
  };
  head.addEventListener("pointerup", headEnd);
  head.addEventListener("pointercancel", headEnd);
  // Aus der Liste heraus: oben angekommen nach unten ziehen klappt ein, nach oben wischen in „halb“ öffnet voll
  let ld = null;
  listEl.addEventListener("touchstart", e => {
    if (!mobile()) return;
    ld = { y0: e.touches[0].clientY, top: listEl.scrollTop <= 0, t: null };
  }, { passive: true });
  listEl.addEventListener("touchmove", e => {
    if (!ld) return;
    const cy = e.touches[0].clientY, dy = cy - ld.y0;
    if (!ld.t && sheetSnap !== "full" && dy < -8) { ld.t = tracker(ld.y0, snapY(sheetSnap)); }
    if (!ld.t && ld.top && listEl.scrollTop <= 0 && dy > 8) { ld.t = tracker(ld.y0, snapY(sheetSnap)); }
    if (ld.t) { e.preventDefault(); ld.t.move(cy); }
  }, { passive: false });
  listEl.addEventListener("touchend", () => { if (ld && ld.t) { snapAt = performance.now(); ld.t.end(); } ld = null; });
  listEl.addEventListener("touchcancel", () => { if (ld && ld.t) ld.t.end(); ld = null; });
  // nur echte Größenänderungen (Drehen, Tastatur) – nicht das Ein-/Ausblenden der Safari-Leisten beim Scrollen
  let lastW = innerWidth, lastH = innerHeight;
  window.addEventListener("resize", () => {
    if (Math.abs(innerWidth - lastW) < 2 && Math.abs(innerHeight - lastH) < 160) return;
    lastW = innerWidth; lastH = innerHeight; setSnap(sheetSnap, false);
  });
  setSnap("peek", false);
  renderList();
  // ---------- Standort
  const toast = (msg, ms = 3000) => { const t = $("#toast"); t.textContent = msg; t.style.display = "block";
    clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms); };
  let meMarker = null, meCircle = null, watchId = null, follow = false, lastListUpdate = 0;

  function onPos(pos) {
    const first = !me;
    me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    const ll = [me.lat, me.lng];
    if (!meMarker) {
      meCircle = L.circle(ll, { radius: pos.coords.accuracy, color: "#2563eb", weight: 1, fillOpacity: .1 }).addTo(map);
      meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me-wrap"><div class="me-cone"></div><div class="me-dot"></div></div>', iconSize: [80, 80], iconAnchor: [40, 40] }),
        zIndexOffset: 1000, interactive: false }).addTo(map);
    } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(pos.coords.accuracy); }
    if (first && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== "function") startCompass();  // ohne Rückfrage möglich (Android)
    const np = places.reduce((m, p) => p.noloc ? m : !m || dist(me, p) < dist(me, m) ? p : m, null);
    const nearest = np ? dist(me, np) : Infinity;
    const wasNear = nearSpots; nearSpots = nearest < 50e3;
    if (first && nearSpots) centerVisible(ll, Math.max(map.getZoom(), 15));
    if (first && !nearSpots && places.length) toast(`Du bist ${fmt(nearest)} vom nächsten Spot entfernt – Entfernungen erscheinen vor Ort.`, 4500);
    if (wasNear !== nearSpots) lastListUpdate = 0;
    if (!first && follow && !popupOpen()) centerVisible(ll);
    if (Date.now() - lastListUpdate > 5000 && !popupOpen() && !stepping && !navigating) { lastListUpdate = Date.now(); renderList(); }
  }
  // Standort robust verfolgen: iOS beendet die Abfrage gern nach Zeitüberschreitung (Gebäude, MTR, Häuserschluchten)
  // oder wenn die App im Hintergrund war – dann still neu starten statt stehen zu bleiben.
  let watchWanted = false, lastFix = 0;
  function onErr(err) {
    if (err.code === 1 || location.protocol === "http:" && location.hostname !== "localhost") {
      toast(err.code === 1 ? "Standortzugriff verweigert – bitte in den Browser-Einstellungen erlauben." : "Standort braucht HTTPS (z.B. GitHub Pages).", 5000);
      watchWanted = false; stopWatch(); $("#locate").classList.remove("active", "follow"); return;
    }
    if (!me) toast("Suche Standort …", 2500);  // vorübergehend (kein GPS-Empfang): Abfrage läuft weiter, der Wächter unten startet sie notfalls neu
  }
  function stopWatch() { if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null; }
  function restartWatch(delay = 0) {
    stopWatch(); clearTimeout(restartWatch.t);
    restartWatch.t = setTimeout(() => { if (watchWanted) startWatch(); }, delay);
  }
  function startWatch() {
    if (!navigator.geolocation) return toast("Geolocation wird nicht unterstützt.");
    watchWanted = true;
    if (watchId === null) watchId = navigator.geolocation.watchPosition(p => { lastFix = Date.now(); onPos(p); }, onErr,
      { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 });
    $("#locate").classList.add("active");
  }
  // zurück aus dem Hintergrund → frisch starten; außerdem Wächter: 25 s ohne neue Position → neu starten
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && watchWanted) restartWatch(); });
  setInterval(() => { if (watchWanted && document.visibilityState === "visible" && Date.now() - lastFix > 20000) { lastFix = Date.now(); restartWatch(); } }, 5000);
  // ---------- Kompass: Blickrichtung als Kegel am Standortpunkt
  let compassOn = false, headingShown = null;
  function onHeading(e) {
    let h = e.webkitCompassHeading;  // iOS: Grad im Uhrzeigersinn ab Norden
    if (h == null && e.absolute && e.alpha != null) h = 360 - e.alpha;  // Android
    if (h == null || isNaN(h)) return;
    h = (h + ((screen.orientation && screen.orientation.angle) || window.orientation || 0) + 360) % 360;
    // kürzester Weg, damit der Kegel bei 359°→1° nicht einmal herumwirbelt
    lastHeading = h;
    if (ROTATE && follow && me) map.setBearing(BEARING_SIGN * h);  // Karte dreht sich mit: Blickrichtung oben
    drawCone();
  }
  // Kegel relativ zum Bildschirm: Blickrichtung minus Drehung der Karte
  let lastHeading = null;
  const BEARING_SIGN = -1;  // leaflet-rotate: Bearing B dreht Norden um +B im Uhrzeigersinn
  function drawCone() {
    if (lastHeading == null) return;
    const h = lastHeading - (ROTATE ? BEARING_SIGN * map.getBearing() : 0);
    headingShown = headingShown == null ? h : headingShown + ((((h - headingShown) % 360) + 540) % 360 - 180);
    const cone = meMarker && meMarker.getElement() && meMarker.getElement().querySelector(".me-cone");
    if (cone) { cone.classList.add("on"); cone.style.setProperty("--h", headingShown + "deg"); }
  }
  if (ROTATE) map.on("rotate", drawCone);
  async function startCompass() {
    if (compassOn || !window.DeviceOrientationEvent) return;
    try {
      if (typeof DeviceOrientationEvent.requestPermission === "function" &&
          (await DeviceOrientationEvent.requestPermission()) !== "granted") return toast("Kompass nicht erlaubt – Blickrichtung wird nicht angezeigt.");
      compassOn = true;
      window.addEventListener("deviceorientationabsolute", onHeading, true);  // Android
      window.addEventListener("deviceorientation", onHeading, true);  // iOS (webkitCompassHeading)
    } catch {}
  }
  $("#locate").addEventListener("click", () => {
    startCompass();
    if (!navigator.geolocation) return toast("Standort wird nicht unterstützt.");
    if (!me || Date.now() - lastFix > 20000) {  // noch kein (frischer) Standort: neu abfragen und dann hinspringen
      toast("Suche Standort …", 2000);
      restartWatch(); startWatch();
      navigator.geolocation.getCurrentPosition(pos => { lastFix = Date.now(); onPos(pos); follow = true; $("#locate").classList.add("follow");
        centerVisible([me.lat, me.lng], Math.max(map.getZoom(), 16)); }, onErr, { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 });
      return;
    }
    startWatch();
    follow = !follow; $("#locate").classList.toggle("follow", follow);
    centerVisible([me.lat, me.lng], Math.max(map.getZoom(), 16));
    toast(follow ? "Karte folgt deinem Standort" : "Folgen aus");
  });
  map.on("dragstart", () => { if (follow) { follow = false; $("#locate").classList.remove("follow"); } });

  // Standort automatisch starten, wenn die Berechtigung bereits erteilt ist
  if (navigator.permissions) navigator.permissions.query({ name: "geolocation" })
    .then(s => { if (s.state === "granted") startWatch(); }).catch(() => {});
  window.__map = map;  // für Tests
  // Direktlink: …/journaway/#spot=<id> → Spot zeigen und öffnen
  function openFromHash() {
    const h = new URLSearchParams(location.hash.slice(1)), id = h.get("spot");
    if (!id) return;
    history.replaceState(null, "", location.pathname + location.search);  // gleicher Link später nochmal antippbar
    const p = places.find(x => x.id === id);
    if (!p) { toast("Spot nicht gefunden", 2500); return; }
    if (mobile()) setSnap("peek");
    map.setView([p.lat, p.lng], Math.max(map.getZoom(), 17), { animate: false });
    if (!shown.has(id)) { stickyId = id; renderList(); }
    const mk = markers.get(id); if (!mk) { toast("Spot nicht gefunden", 2500); return; }
    setTimeout(() => cluster.zoomToShowLayer(mk, () => openSpot(mk)), 400);
  }
  window.addEventListener("hashchange", openFromHash);
  setTimeout(openFromHash, 900);
}
startApp();
</script>
</body>
</html>
