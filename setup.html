<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key verschlüsseln</title>
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 520px;
    margin: 0 auto; padding: 24px 16px; background: #fff; color: #111827; }
  @media (prefers-color-scheme: dark) { body { background: #111827; color: #f3f4f6; } }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; font-size: 15px; border-radius: 8px; border: 1px solid #9ca3af; }
  button { margin-top: 16px; padding: 10px 16px; font-size: 15px; border: 0; border-radius: 8px; background: #e1306c; color: #fff; }
  textarea { height: 110px; font-family: ui-monospace, monospace; font-size: 12px; }
  small { color: #6b7280; }
</style>
</head>
<body>
<h1>Google-Maps-Key verschlüsseln</h1>
<p><small>Läuft komplett lokal im Browser, nichts wird gesendet.</small></p>
<label>Google-Maps-API-Key <input id="key" autocomplete="off"></label>
<label>Zugangscode <input id="code" type="password" autocomplete="new-password"></label>
<button id="go">Verschlüsseln</button>
<label>Zeile für <code>config.js</code> <textarea id="out" readonly></textarea></label>
<script src="crypto.js"></script>
<script>
  document.getElementById("go").onclick = async () => {
    const key = document.getElementById("key").value.trim(), code = document.getElementById("code").value;
    if (!key || code.length < 6) return alert("Key und einen Code mit mindestens 6 Zeichen eingeben.");
    const enc = await InstaMapCrypto.encrypt(key, code);
    document.getElementById("out").value = `window.GOOGLE_MAPS_KEY_ENC = "${enc}";`;
  };
</script>
</body>
</html>
