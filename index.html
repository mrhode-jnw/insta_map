<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Insta Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<style>
  :root {
    --bg: #ffffff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #e1306c; --me: #2563eb; --shadow: 0 6px 24px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --line: #374151; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: fixed; inset: 0; }

  .fab { position: fixed; right: 14px; z-index: 1000; width: 48px; height: 48px; border-radius: 50%;
    border: 0; background: var(--bg); color: var(--fg); box-shadow: var(--shadow); font-size: 22px;
    display: grid; place-items: center; cursor: pointer; }
  #locate { bottom: calc(env(safe-area-inset-bottom) + 92px); }
  #locate.active { color: var(--me); }
  #locate.follow { background: var(--me); color: #fff; }

  /* Bottom-Sheet mit Liste */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1001; background: var(--bg);
    border-radius: 16px 16px 0 0; box-shadow: var(--shadow); max-height: 72vh; display: flex;
    flex-direction: column; transform: translateY(calc(100% - 76px - env(safe-area-inset-bottom)));
    transition: transform .25s ease; padding-bottom: env(safe-area-inset-bottom); }
  #sheet.open { transform: none; }
  #sheet header { padding: 8px 14px 10px; cursor: pointer; }
  #sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 8px; }
  #sheet .row { display: flex; gap: 8px; align-items: center; }
  #search { flex: 1; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--fg); font-size: 16px; }
  #count { color: var(--muted); font-size: 13px; white-space: nowrap; }
  #list { overflow-y: auto; list-style: none; margin: 0; padding: 0 0 8px; -webkit-overflow-scrolling: touch; }
  #list li { display: flex; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  #list img, .noimg { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex: none; background: var(--line); }
  #list .t { font-weight: 600; }
  #list .s { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #list .d { margin-left: auto; color: var(--me); font-size: 13px; white-space: nowrap; }
  #empty { padding: 16px; color: var(--muted); }

  @media (min-width: 800px) {
    #sheet { left: 14px; right: auto; top: 14px; bottom: 14px; width: 360px; max-height: none;
      border-radius: 16px; transform: none; }
    #sheet .grip { display: none; }
    #locate { bottom: 28px; }
  }

  /* Popup */
  .leaflet-popup-content-wrapper { border-radius: 14px; padding: 0; overflow: hidden; }
  .leaflet-popup-content { margin: 0; width: 260px !important; }
  .pop img { width: 100%; height: 180px; object-fit: cover; display: block; background: #eee; }
  .pop .b { padding: 10px 12px 12px; }
  .pop h3 { margin: 0 0 4px; font-size: 16px; }
  .pop .addr { color: #4b5563; font-size: 13px; margin-bottom: 6px; }
  .pop .cap { color: #374151; font-size: 12.5px; max-height: 80px; overflow: auto; white-space: pre-line; margin-bottom: 8px; }
  .pop .links { display: flex; gap: 6px; flex-wrap: wrap; }
  .pop .links a { flex: 1; text-align: center; padding: 7px 6px; border-radius: 8px; font-size: 13px;
    text-decoration: none; background: #f3f4f6; color: #111827 !important; white-space: nowrap; }
  .pop .links a.ig { background: var(--accent); color: #fff !important; }
  .pop .dist { color: var(--me); font-size: 12px; margin-bottom: 4px; }

  .pin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
    background: var(--accent) center/cover no-repeat; }
  .me-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--me); border: 3px solid #fff;
    box-shadow: 0 0 0 0 rgba(37,99,235,.5); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 14px rgba(37,99,235,0); } 100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); } }

  #toast { position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 50%; transform: translateX(-50%);
    z-index: 1002; background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px;
    display: none; max-width: 90vw; text-align: center; }
</style>
</head>
<body>
<div id="map"></div>
<button id="locate" class="fab" title="Mein Standort" aria-label="Mein Standort">◎</button>

<section id="sheet">
  <header id="sheetHead">
    <div class="grip"></div>
    <div class="row">
      <input id="search" type="search" placeholder="Orte durchsuchen …" autocomplete="off">
      <span id="count"></span>
    </div>
  </header>
  <ul id="list"></ul>
</section>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="data/places.js"></script>
<script>
(() => {
  const places = (window.PLACES || []).filter(p => isFinite(p.lat) && isFinite(p.lng));
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const map = L.map("map", { zoomControl: false, tap: true }).setView([22.3, 114.17], 12);
  L.control.zoom({ position: "topright" }).addTo(map);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  // ---------- Marker
  const cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 45 });
  const markers = new Map();
  let me = null;

  const dist = (a, b) => {
    const R = 6371e3, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };
  const fmt = m => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)} km`;

  function popupHtml(p) {
    const d = me ? `<div class="dist">📍 ${fmt(dist(me, p))} entfernt</div>` : "";
    const nav = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
    return `<div class="pop">
      ${p.image ? `<a href="${esc(p.post_url)}" target="_blank" rel="noopener"><img src="${esc(p.image)}" alt="" loading="lazy"></a>` : ""}
      <div class="b">
        <h3>${esc(p.name)}</h3>
        ${d}
        <div class="addr">${esc(p.address)}<br><small>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</small></div>
        ${p.caption ? `<div class="cap">${esc(p.caption)}</div>` : ""}
        <div class="links">
          <a class="ig" href="${esc(p.post_url)}" target="_blank" rel="noopener">Post</a>
          ${p.profile_url ? `<a href="${esc(p.profile_url)}" target="_blank" rel="noopener">@${esc(p.username)}</a>` : ""}
          <a href="${nav}" target="_blank" rel="noopener">Route</a>
        </div>
      </div></div>`;
  }

  places.forEach(p => {
    const icon = L.divIcon({
      className: "", iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -14],
      html: `<div class="pin" style="${p.image ? `background-image:url('${esc(p.image)}')` : ""}"></div>`
    });
    const m = L.marker([p.lat, p.lng], { icon, title: p.name });
    m.bindPopup(() => popupHtml(p), { maxWidth: 260, autoPanPaddingTopLeft: [10, 60] });
    markers.set(p.id, m);
    cluster.addLayer(m);
  });
  map.addLayer(cluster);
  if (places.length) map.fitBounds(cluster.getBounds(), { padding: [40, 40] });

  // ---------- Liste
  function renderList() {
    const q = $("#search").value.trim().toLowerCase();
    let items = places.filter(p => !q || [p.name, p.address, p.caption, p.username].join(" ").toLowerCase().includes(q));
    if (me) items = items.map(p => ({ ...p, _d: dist(me, p) })).sort((a, b) => a._d - b._d);
    $("#count").textContent = `${items.length} Orte`;
    $("#list").innerHTML = items.length ? items.map(p => `
      <li data-id="${esc(p.id)}">
        ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : `<div class="noimg"></div>`}
        <div style="min-width:0"><div class="t">${esc(p.name)}</div><div class="s">${esc(p.address)}</div></div>
        ${me ? `<div class="d">${fmt(p._d)}</div>` : ""}
      </li>`).join("")
      : `<li id="empty">${places.length ? "Keine Treffer." : "Noch keine Orte – siehe README (tools/build_places.py)."}</li>`;
  }
  $("#list").addEventListener("click", e => {
    const li = e.target.closest("li[data-id]"); if (!li) return;
    const m = markers.get(li.dataset.id);
    if (window.innerWidth < 800) $("#sheet").classList.remove("open");
    cluster.zoomToShowLayer(m, () => m.openPopup());
  });
  $("#search").addEventListener("input", renderList);
  $("#search").addEventListener("focus", () => $("#sheet").classList.add("open"));
  $("#sheetHead").addEventListener("click", e => { if (e.target.id !== "search") $("#sheet").classList.toggle("open"); });
  renderList();

  // ---------- Standort
  const toast = (msg, ms = 3000) => { const t = $("#toast"); t.textContent = msg; t.style.display = "block";
    clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms); };
  let meMarker = null, meCircle = null, watchId = null, follow = false, lastListUpdate = 0;

  function onPos(pos) {
    const first = !me;
    me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    const ll = [me.lat, me.lng];
    if (!meMarker) {
      meCircle = L.circle(ll, { radius: pos.coords.accuracy, color: "#2563eb", weight: 1, fillOpacity: .1 }).addTo(map);
      meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }),
        zIndexOffset: 1000, interactive: false }).addTo(map);
    } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(pos.coords.accuracy); }
    if (first || follow) map.setView(ll, first ? Math.max(map.getZoom(), 15) : map.getZoom());
    if (Date.now() - lastListUpdate > 5000) { lastListUpdate = Date.now(); renderList(); }
  }
  function onErr(err) {
    const msgs = { 1: "Standortzugriff verweigert – bitte in den Browser-Einstellungen erlauben.",
                   2: "Standort nicht verfügbar.", 3: "Standort-Zeitüberschreitung." };
    toast(location.protocol === "http:" && location.hostname !== "localhost"
      ? "Standort braucht HTTPS (z.B. GitHub Pages)." : (msgs[err.code] || err.message), 5000);
    $("#locate").classList.remove("active", "follow");
  }
  function startWatch() {
    if (!navigator.geolocation) return toast("Geolocation wird nicht unterstützt.");
    if (watchId === null) watchId = navigator.geolocation.watchPosition(onPos, onErr,
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    $("#locate").classList.add("active");
  }
  $("#locate").addEventListener("click", () => {
    startWatch();
    if (me) { follow = !follow; $("#locate").classList.toggle("follow", follow);
      map.setView([me.lat, me.lng], Math.max(map.getZoom(), 16));
      toast(follow ? "Karte folgt deinem Standort" : "Folgen aus"); }
  });
  map.on("dragstart", () => { if (follow) { follow = false; $("#locate").classList.remove("follow"); } });

  // Standort automatisch starten, wenn die Berechtigung bereits erteilt ist
  if (navigator.permissions) navigator.permissions.query({ name: "geolocation" })
    .then(s => { if (s.state === "granted") startWatch(); }).catch(() => {});
})();
</script>
</body>
</html>
