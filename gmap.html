<!doctype html>
<meta charset="utf-8">
<title>Insta Map – drehbar</title>
<script>
  // Drehbare Google-Karte = Hauptkarte mit ?google (alle Funktionen gleich)
  const q = new URLSearchParams(location.search); q.set("google", "");
  location.replace("index.html?" + q.toString().replace("google=", "google"));
</script>
