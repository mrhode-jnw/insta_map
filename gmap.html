<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Insta Map – Google (drehbar)</title>
<style>
  :root { --bg: #fff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --accent: #e1306c; --shadow: 0 6px 24px rgba(0,0,0,.18); }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #f9fafb; --muted: #9ca3af; --line: #374151; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  #map { position: fixed; inset: 0; }
  #bar { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 10px; right: 10px; z-index: 5; display: flex; gap: 4px; align-items: center;
    background: var(--bg); border-radius: 999px; box-shadow: var(--shadow); padding: 3px; overflow-x: auto; scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  #bar select, #bar button { flex: none; border: 0; background: transparent; color: var(--fg); padding: 7px 10px; border-radius: 999px; font-size: 14px; }
  #bar select { font-weight: 600; }
  #bar button.on { background: var(--accent); color: #fff; }
  .fab { position: fixed; right: 12px; z-index: 5; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--bg); color: var(--fg);
    box-shadow: var(--shadow); font-size: 22px; }
  #locate { bottom: calc(env(safe-area-inset-bottom) + 24px); }
  #locate.follow { background: #2563eb; color: #fff; }
  #north { bottom: calc(env(safe-area-inset-bottom) + 82px); font-size: 20px; }
  #north span { display: inline-block; transition: transform .2s; }
  #back { position: fixed; left: 12px; bottom: calc(env(safe-area-inset-bottom) + 24px); z-index: 5; background: var(--bg); color: var(--fg);
    border-radius: 999px; box-shadow: var(--shadow); padding: 10px 14px; font-size: 13px; text-decoration: none; }
  #count { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 30px); z-index: 4;
    background: rgba(17,24,39,.75); color: #fff; padding: 4px 10px; border-radius: 999px; font-size: 12px; }
  .pin { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #fff; background: #e1306c center/cover; box-shadow: 0 2px 6px rgba(0,0,0,.4); position: relative; }
  .pin.claude { border-color: #7c3aed; } .pin.fav { box-shadow: 0 0 0 2px #e11d48, 0 2px 6px rgba(0,0,0,.4); }
  .pin.done { filter: grayscale(.8); opacity: .8; }
  .pin i { position: absolute; left: -7px; bottom: -7px; width: 18px; height: 18px; border-radius: 50%; background: #fff; color: #e11d48; font-size: 11px; line-height: 18px; text-align: center; font-style: normal; }
  .hotel { width: 24px; height: 24px; border-radius: 7px; background: #fff; border: 2px solid #2563eb; display: grid; place-items: center; font-size: 13px; }
  .me { position: relative; width: 80px; height: 80px; }
  .me .dot { position: absolute; left: 31px; top: 31px; width: 18px; height: 18px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(37,99,235,.2); }
  .me .cone { position: absolute; inset: 0; display: none; border-radius: 50%; transform: rotate(var(--h, 0deg));
    background: conic-gradient(from -35deg, rgba(37,99,235,.55) 0deg 70deg, transparent 70deg);
    -webkit-mask: radial-gradient(circle, #000 0 15%, rgba(0,0,0,.6) 45%, transparent 70%); mask: radial-gradient(circle, #000 0 15%, rgba(0,0,0,.6) 45%, transparent 70%); }
  .me .cone.on { display: block; }
  #card { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 6; width: min(420px, calc(100% - 20px));
    max-height: 72vh; overflow-y: auto; background: var(--bg); border-radius: 16px; box-shadow: var(--shadow); }
  #card[hidden] { display: none; }
  #card .top { display: flex; align-items: center; justify-content: space-between; padding: 8px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  #card .top button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; width: 40px; height: 36px; font-size: 18px; }
  #card .top .x { background: #111827; color: #fff; border: 0; }
  #card img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; max-height: 46vh; }
  #card .b { padding: 10px 14px 14px; }
  #card h3 { margin: 0 0 4px; font-size: 18px; }
  #card .meta { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  #card .tip { background: #ecfeff; color: #155e75; border-radius: 8px; padding: 6px 8px; font-size: 13px; margin: 6px 0; }
  #card .note { font-size: 14px; margin: 6px 0; }
  #card .credit { font-size: 11px; color: var(--muted); padding: 2px 14px 0; }
  #card .links { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  #card .links a { flex: 1; text-align: center; padding: 8px 6px; border-radius: 8px; font-size: 13px; text-decoration: none; background: #f3f4f6; color: #111827; white-space: nowrap; }
  #card .links a.ig { background: var(--accent); color: #fff; }
  #gate { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--bg); }
  #gate[hidden] { display: none; }
  #gate form { display: grid; gap: 10px; width: 260px; text-align: center; }
  #gate input, #gate button { padding: 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 16px; }
  #gate button { background: var(--accent); color: #fff; border: 0; }
  #toast { position: fixed; top: calc(env(safe-area-inset-top) + 64px); left: 50%; transform: translateX(-50%); z-index: 30; background: #111827; color: #fff;
    border-radius: 999px; padding: 9px 14px; font-size: 13px; display: none; max-width: 90%; text-align: center; }
</style>
</head>
<body>
<div id="gate" hidden><form id="gateForm"><b>Insta Map</b><input id="gateCode" type="password" placeholder="Zugangscode" autofocus><button>Öffnen</button><div id="gateErr"></div></form></div>
<div id="map"></div>
<div id="bar">
  <select id="where" aria-label="Bereich"><option value="route">🧭 Route</option><option value="hk">🇭🇰 Hongkong</option><option value="cn">🇨🇳 China</option><option value="all">🌏 Alles</option></select>
  <button data-g="fotos" class="on">📷 Fotos</button><button data-g="food">🍜 Food</button><button data-g="claude">✦ Tipps</button><button data-fav>❤️</button>
</div>
<button id="north" class="fab" title="Nach Norden ausrichten" aria-label="Nach Norden ausrichten"><span>🧭</span></button>
<button id="locate" class="fab" title="Mein Standort – nochmal tippen: Karte folgt Blickrichtung" aria-label="Mein Standort">◎</button>
<a id="back" href="index.html">← Hauptkarte</a>
<div id="count"></div>
<div id="card" hidden></div>
<div id="toast"></div>
<script>
  const v = Date.now();
  document.write(`<script src="config.js?v=${v}"><\/script><script src="data/places.js?v=${v}"><\/script><script src="data/china.js?v=${v}"><\/script><script src="data/trip.js?v=${v}"><\/script>`);
</script>
<script src="crypto.js"></script>
<script>
// Variante mit echter Google-Vektorkarte: mit zwei Fingern drehen und kippen. Spots, Route und Hotels wie in der Hauptkarte;
// Bewertungen/Favoriten werden angezeigt, bearbeitet wird in der Hauptkarte.
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = (m, ms = 3000) => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms); };
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, x) => { try { x == null ? localStorage.removeItem(k) : localStorage.setItem(k, x); } catch {} } };
const places = [...(window.PLACES || []), ...(window.PLACES_CN || [])].filter(p => isFinite(p.lat) && isFinite(p.lng));
const ROUTE = window.TRIP.route, HOTELS = window.TRIP.hotels;
const dist = (a, b) => { const R = 6371e3, t = Math.PI / 180, dl = (b.lat - a.lat) * t, dn = (b.lng - a.lng) * t;
  const x = Math.sin(dl / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
const regionOf = p => p.region || (p.lat > 22.15 && p.lat < 22.57 && p.lng > 113.82 && p.lng < 114.45 ? "hk" : "cn");
const routeStop = p => { let best = -1, bd = Infinity; ROUTE.forEach((r, i) => { const d = dist(r, p); if (d <= r.r * 1000 && d < bd) { best = i; bd = d; } }); return best; };
const GROUPS = { food: p => !p.by_claude && p.category === "Food", fotos: p => !p.by_claude && p.category !== "Food", claude: p => p.by_claude };

async function start(key) {
  const mapId = new URLSearchParams(location.search).get("mapid") || store.get("gmapId") || "DEMO_MAP_ID";
  if (new URLSearchParams(location.search).get("mapid")) store.set("gmapId", mapId);
  // Google-Maps-Lader (offizielles Snippet)
  (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({ key, v: "weekly", language: "de" });
  let maps, markerLib;
  try { maps = await google.maps.importLibrary("maps"); markerLib = await google.maps.importLibrary("marker"); }
  catch { toast("Google Maps konnte nicht geladen werden (Internet / China?) – bitte die Hauptkarte nutzen.", 8000); return; }
  await new Promise(r => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"; s.onload = r; s.onerror = r; document.head.append(s); });

  const map = new maps.Map($("#map"), { center: { lat: 22.3, lng: 114.17 }, zoom: 12, mapId, renderingType: maps.RenderingType.VECTOR,
    headingInteractionEnabled: true, tiltInteractionEnabled: true, gestureHandling: "greedy", disableDefaultUI: true, clickableIcons: false });
  window.__gmap = map;
  setTimeout(() => { if (map.getRenderingType && map.getRenderingType() !== "VECTOR")
    toast("Drehen nicht verfügbar: Google liefert hier keine Vektorkarte (Map-ID oder Gerät unterstützt es nicht).", 7000); }, 4000);

  // Status (Favoriten, Priorität, fotografiert) aus dem Repo – nur lesen
  let status = {};
  fetch("https://raw.githubusercontent.com/mrhode-jnw/insta_map/map-data/data/my-status.json?" + Date.now()).then(r => r.ok ? r.json() : {}).then(s => { status = s || {}; render(); }).catch(() => {});
  const st = id => status[id] || {};

  // Marker
  const { AdvancedMarkerElement } = markerLib;
  const markers = new Map();
  function pinEl(p) {
    const s = st(p.id), d = document.createElement("div");
    d.className = ["pin", p.by_claude ? "claude" : "", s.fav ? "fav" : "", s.done ? "done" : ""].join(" ");
    if (p.image) d.style.backgroundImage = `url('${p.image}')`;
    if (s.fav) d.innerHTML = "<i>❤</i>";
    return d;
  }
  places.forEach(p => {
    const m = new AdvancedMarkerElement({ position: { lat: p.lat, lng: p.lng }, content: pinEl(p), title: p.name, gmpClickable: true });
    m.addEventListener("gmp-click", () => openCard(p.id));
    markers.set(p.id, m);
  });
  const clusterer = window.markerClusterer ? new markerClusterer.MarkerClusterer({ map, markers: [] }) : null;

  // Route & Hotels
  const routeLine = new google.maps.Polyline({ path: ROUTE.map(r => ({ lat: r.lat, lng: r.lng })), strokeColor: "#2563eb", strokeOpacity: 0,
    icons: [{ icon: { path: "M 0,-1 0,1", strokeOpacity: .6, scale: 3 }, offset: "0", repeat: "14px" }] });
  HOTELS.forEach(H => {
    const d = document.createElement("div"); d.className = "hotel"; d.textContent = "🏨";
    const m = new AdvancedMarkerElement({ map, position: { lat: H.lat, lng: H.lng }, content: d, title: H.name, zIndex: -1, gmpClickable: true });
    m.addEventListener("gmp-click", () => { $("#card").hidden = false; $("#card").innerHTML = `<div class="top"><button class="x" onclick="this.closest('#card').hidden=true">✕</button><span>Unser Hotel</span><span></span></div>
      <div class="b"><h3>🏨 ${esc(H.name)}</h3><div class="meta">${esc(H.zh)}</div><div class="note">${esc([H.dates, H.room].filter(Boolean).join(" · "))}</div>
      <div class="meta">${esc(H.address)}</div><div class="links"><a href="https://www.google.com/maps/dir/?api=1&destination=${H.lat},${H.lng}" target="_blank" rel="noopener">Route</a></div></div>`; });
  });

  // Filter
  let where = store.get("where") || "route", group = "fotos", favF = false;
  if (!["route", "hk", "cn", "all"].includes(where)) where = "route";
  $("#where").value = where;
  const inScope = p => where === "route" ? routeStop(p) >= 0 : where === "all" || regionOf(p) === where;
  const visible = p => inScope(p) && (!group || GROUPS[group](p)) && (!favF || st(p.id).fav);
  let shown = [];
  function render() {
    shown = places.filter(visible);
    shown.forEach(p => markers.get(p.id).content = pinEl(p));
    if (clusterer) { clusterer.clearMarkers(); clusterer.addMarkers(shown.map(p => markers.get(p.id))); }
    else { markers.forEach((m, id) => m.map = shown.some(p => p.id === id) ? map : null); }
    routeLine.setMap(where === "route" ? map : null);
    $("#count").textContent = `${shown.length} Orte`;
    document.querySelectorAll("#bar [data-g]").forEach(b => b.classList.toggle("on", b.dataset.g === group));
    $("#bar [data-fav]").classList.toggle("on", favF);
  }
  function fit() {
    const ps = where === "route" ? ROUTE : places.filter(inScope); if (!ps.length) return;
    const b = new google.maps.LatLngBounds(); ps.forEach(p => b.extend({ lat: p.lat, lng: p.lng })); map.fitBounds(b, 40);
  }
  $("#where").onchange = e => { where = e.target.value; store.set("where", where); render(); fit(); };
  document.querySelectorAll("#bar [data-g]").forEach(b => b.onclick = () => { group = group === b.dataset.g ? "" : b.dataset.g; render(); });
  $("#bar [data-fav]").onclick = () => { favF = !favF; render(); toast(favF ? "Nur Favoriten" : "Alle Spots", 1200); };
  render();
  // Start: Hongkong-Kern
  { const b = new google.maps.LatLngBounds(); places.filter(p => regionOf(p) === "hk" && dist(p, { lat: 22.3, lng: 114.17 }) < 30e3).forEach(p => b.extend({ lat: p.lat, lng: p.lng })); map.fitBounds(b, 30); }

  // Spot-Karte
  let curId = null;
  function openCard(id) {
    const p = places.find(x => x.id === id); if (!p) return; curId = id;
    const s = st(id), rs = routeStop(p);
    const post = p.post_url || (p.posts && p.posts[0] && p.posts[0].url) || "";
    $("#card").hidden = false;
    $("#card").innerHTML = `<div class="top"><button class="x" data-x>✕</button><span>
        <button data-go="-1" aria-label="Vorheriger Spot">‹</button> <button data-go="1" aria-label="Nächster Spot">›</button></span><span style="width:40px"></span></div>
      ${p.image ? `<img src="${esc(p.image)}" alt="">` : ""}${p.image_credit ? `<div class="credit">Foto: ${esc(p.image_credit)}</div>` : ""}
      <div class="b"><h3>${s.fav ? "❤ " : ""}${esc(p.name)}</h3>
        <div class="meta">${esc([p.category, p.district, rs >= 0 ? "🧭 " + ROUTE[rs].d : "", p.pop ? "🔥" + p.pop : "", s.prio ? "Priorität: " + s.prio : "", s.done ? "✓ fotografiert" : ""].filter(Boolean).join(" · "))}</div>
        ${p.by_claude ? `<div class="meta">✦ Claude-Tipp</div>` : ""}
        ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
        ${p.tip ? `<div class="tip"><b>📸 Foto-Tipp</b> ${esc(p.tip)}</div>` : ""}
        <div class="links">${post ? `<a class="ig" href="${esc(post)}" target="_blank" rel="noopener">Post</a>` : ""}
          <a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" rel="noopener">Route</a>
          <a href="index.html">Bewerten in Hauptkarte</a></div></div>`;
    $("#card [data-x]").onclick = () => { $("#card").hidden = true; curId = null; };
    $("#card").querySelectorAll("[data-go]").forEach(b => b.onclick = () => step(+b.dataset.go));
  }
  // ‹ › nur durch Spots im sichtbaren Ausschnitt
  function step(dir) {
    const bounds = map.getBounds(); if (!bounds) return;
    const list = shown.filter(p => p.id === curId || bounds.contains({ lat: p.lat, lng: p.lng }));
    if (list.length < 2) return;
    const i = list.findIndex(p => p.id === curId), next = list[(i + dir + list.length) % list.length];
    openCard(next.id);
  }

  // Standort, Blickrichtung, Karte folgt Blickrichtung
  let me = null, meMarker = null, follow = false, compass = false, heading = null;
  const meEl = document.createElement("div"); meEl.className = "me"; meEl.innerHTML = '<div class="cone"></div><div class="dot"></div>';
  function drawCone() {
    if (heading == null) return;
    const c = meEl.querySelector(".cone"); c.classList.add("on");
    c.style.setProperty("--h", (heading - (map.getHeading() || 0)) + "deg");
    $("#north span").style.transform = `rotate(${-(map.getHeading() || 0)}deg)`;
  }
  map.addListener("heading_changed", drawCone);
  function onHeading(e) {
    let h = e.webkitCompassHeading; if (h == null && e.absolute && e.alpha != null) h = 360 - e.alpha; if (h == null || isNaN(h)) return;
    heading = (h + ((screen.orientation && screen.orientation.angle) || 0) + 360) % 360;
    if (follow && me) map.moveCamera({ center: me, heading });
    drawCone();
  }
  async function startCompass() {
    if (compass || !window.DeviceOrientationEvent) return;
    try {
      if (typeof DeviceOrientationEvent.requestPermission === "function" && (await DeviceOrientationEvent.requestPermission()) !== "granted") return;
      compass = true; addEventListener("deviceorientationabsolute", onHeading, true); addEventListener("deviceorientation", onHeading, true);
    } catch {}
  }
  function watch() {
    if (!navigator.geolocation || watch.id) return;
    watch.id = navigator.geolocation.watchPosition(pos => {
      const first = !me; me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (!meMarker) meMarker = new AdvancedMarkerElement({ map, position: me, content: meEl, zIndex: 999 }); else meMarker.position = me;
      if (first) map.moveCamera({ center: me, zoom: Math.max(map.getZoom(), 16) });
      if (follow) map.moveCamera({ center: me });
    }, () => toast("Standort nicht verfügbar."), { enableHighAccuracy: true, maximumAge: 5000 });
  }
  $("#locate").onclick = () => {
    startCompass(); watch();
    if (!me) return;
    follow = !follow; $("#locate").classList.toggle("follow", follow);
    if (follow) { map.moveCamera({ center: me, zoom: Math.max(map.getZoom(), 17), heading: heading ?? map.getHeading(), tilt: 45 }); toast("Karte folgt deiner Blickrichtung", 1800); }
    else toast("Folgen aus", 1200);
  };
  map.addListener("dragstart", () => { if (follow) { follow = false; $("#locate").classList.remove("follow"); } });
  $("#north").onclick = () => map.moveCamera({ heading: 0, tilt: 0 });
}

// Zugangscode wie in der Hauptkarte (gemerkter Code wird übernommen)
(async () => {
  const enc = (window.GOOGLE_MAPS_KEY_ENC || "").trim();
  const tryCode = async c => { try { return await InstaMapCrypto.decrypt(enc, c); } catch { return null; } };
  const saved = store.get("mapCode");
  if (saved) { const k = await tryCode(saved); if (k) return start(k); }
  $("#gate").hidden = false;
  $("#gateForm").onsubmit = async e => {
    e.preventDefault(); const c = $("#gateCode").value, k = await tryCode(c);
    if (!k) { $("#gateErr").textContent = "Falscher Code"; return; }
    store.set("mapCode", c); $("#gate").hidden = true; start(k);
  };
})();
</script>
</body>
</html>
