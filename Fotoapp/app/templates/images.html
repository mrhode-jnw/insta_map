{% extends "base.html" %}
{% block title %}Bibliothek – Sehschule{% endblock %}
{% block content %}
<h1>Bibliothek <span class="muted">{{ images | length }} Bilder</span></h1>
<div class="tags">
  <a href="/images" class="tag {% if not tag %}on{% endif %}">alle</a>

</div>

{% endblock %}
