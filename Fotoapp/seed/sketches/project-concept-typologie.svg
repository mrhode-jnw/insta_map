<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <text x="90" y="16" text-anchor="middle" class="h">Typologie</text>
  <text x="270" y="16" text-anchor="middle" class="h">Wiederholung</text>
  <line x1="180" y1="8" x2="180" y2="226" class="m" stroke-dasharray="2 4"/>
  <!-- typology: same view, different structures -->
  <g>
    <rect x="22" y="30" width="44" height="44"/><rect x="72" y="30" width="44" height="44"/><rect x="122" y="30" width="44" height="44"/>
