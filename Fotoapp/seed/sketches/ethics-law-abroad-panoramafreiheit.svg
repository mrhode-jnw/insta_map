<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- ground -->
  <line x1="10" y1="170" x2="350" y2="170" class="m"/>
  <text x="14" y="186" class="m">öffentliche Straße</text>
  <!-- building -->
  <path d="M170 170 V96 L215 70 L260 96 V170"/>
  <rect x="200" y="128" width="30" height="42" class="f" stroke="none"/>
  <rect x="180" y="104" width="14" height="14" class="m"/><rect x="236" y="104" width="14" height="14" class="m"/>
  <!-- inside viewer -->
  <rect x="207" y="146" width="9" height="6" class="mf" stroke="none"/>
  <line x1="216" y1="149" x2="250" y2="149" class="m" stroke-dasharray="2 3"/>
  <!-- street photographer -->
  <line x1="60" y1="170" x2="60" y2="140"/><circle cx="60" cy="135" r="5"/>
  <rect x="66" y="134" width="10" height="7" class="af" stroke="none"/>
  <line x1="76" y1="136" x2="168" y2="96" class="a" stroke-dasharray="3 3"/>
  <line x1="76" y1="139" x2="168" y2="150" class="a" stroke-dasharray="3 3"/>
  <!-- drone -->
  <path d="M286 30 h28 M290 30 v-4 M310 30 v-4" class="m"/>
  <rect x="295" y="32" width="10" height="7" class="af" stroke="none"/>
  <line x1="298" y1="40" x2="252" y2="80" class="m" stroke-dasharray="3 3"/>
  <!-- labels -->
  <text x="60" y="214" text-anchor="middle" class="a">Straßenblick</text>
  <text x="60" y="228" text-anchor="middle">äußere Ansicht</text>
  <text x="60" y="242" text-anchor="middle" class="a">§ 59 ✓</text>
  <text x="215" y="214" text-anchor="middle" class="m">Innenraum</text>
  <text x="215" y="228" text-anchor="middle" class="m">nicht im Wortlaut</text>
  <text x="215" y="242" text-anchor="middle" class="m">§ 59 ✗</text>
  <text x="318" y="62" text-anchor="middle" class="m">Drohne</text>
  <text x="318" y="76" text-anchor="middle" class="m">über Werk</text>
  <text x="318" y="90" text-anchor="middle" class="m">BGH 2024: ✗</text>
  <text x="14" y="20" class="h">Wer sieht das Werk von wo?</text>
  <text x="14" y="36" class="m">frei ist, was die Allgemeinheit</text>
  <text x="14" y="50" class="m">von der Straße wahrnimmt</text>
</svg>
