<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- six steps of a crit, snake layout; the author speaks last -->
  <path d="M60 40 H300 Q340 40 340 80 Q340 120 300 120 H60" class="m" stroke-dasharray="3 4"/>
  <circle cx="60" cy="40" r="14" class="f"/><text x="60" y="44" text-anchor="middle" class="h">1</text>
  <circle cx="180" cy="40" r="14" class="f"/><text x="180" y="44" text-anchor="middle" class="h">2</text>
  <circle cx="300" cy="40" r="14" class="f"/><text x="300" y="44" text-anchor="middle" class="h">3</text>
  <circle cx="300" cy="120" r="14" class="f"/><text x="300" y="124" text-anchor="middle" class="h">4</text>
  <circle cx="180" cy="120" r="14" class="f"/><text x="180" y="124" text-anchor="middle" class="h">5</text>
  <circle cx="60" cy="120" r="14" class="a"/><circle cx="60" cy="120" r="14" class="af" stroke="none" fill-opacity="0.25"/><text x="60" y="124" text-anchor="middle" class="h">6</text>
  <text x="60" y="70" text-anchor="middle">Schauen</text><text x="60" y="84" text-anchor="middle" class="m">1 Min. still</text>
  <text x="180" y="70" text-anchor="middle">Beschreiben</text><text x="180" y="84" text-anchor="middle" class="m">nur Sichtbares</text>
  <text x="300" y="70" text-anchor="middle">Analysieren</text><text x="250" y="84" class="m">was bewirkt es?</text>
  <text x="300" y="150" text-anchor="middle">Deuten</text><text x="300" y="164" text-anchor="middle" class="m">+ Gegenlesart</text>
  <text x="180" y="150" text-anchor="middle">Urteilen</text><text x="180" y="164" text-anchor="middle" class="m">Maßstab nennen</text>
  <text x="60" y="150" text-anchor="middle" class="a">Autorin</text><text x="60" y="164" text-anchor="middle" class="a">erst jetzt</text>
  <text x="180" y="192" text-anchor="middle" class="m">„Ich sehe … Das bewirkt … Ich lese das als …, weil …“</text>
</svg>
