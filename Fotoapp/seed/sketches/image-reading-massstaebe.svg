<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Barrett's four criteria as a 2x2 grid; the judgement names one of them -->
  <rect x="10" y="10" width="165" height="85" rx="6"/>
  <rect x="185" y="10" width="165" height="85" rx="6"/>
  <rect x="10" y="105" width="165" height="85" rx="6"/>
  <rect x="185" y="105" width="165" height="85" rx="6"/>
  <text x="92" y="32" text-anchor="middle" class="h">Realismus</text>
  <text x="92" y="54" text-anchor="middle" class="m">Zeigt es die Welt</text>
  <text x="92" y="68" text-anchor="middle" class="m">klarer, als man sie</text>
  <text x="92" y="82" text-anchor="middle" class="m">vor Ort sieht?</text>
  <text x="267" y="32" text-anchor="middle" class="h">Expressionismus</text>
  <text x="267" y="54" text-anchor="middle" class="m">Macht es ein</text>
  <text x="267" y="68" text-anchor="middle" class="m">Gefühl spürbar?</text>
  <text x="92" y="127" text-anchor="middle" class="h">Formalismus</text>
  <text x="92" y="149" text-anchor="middle" class="m">Trägt die Form,</text>
  <text x="92" y="163" text-anchor="middle" class="m">die Ordnung?</text>
  <text x="267" y="127" text-anchor="middle" class="h">„Activism“</text>
  <text x="267" y="149" text-anchor="middle" class="m">Macht es eine</text>
  <text x="267" y="163" text-anchor="middle" class="m">Haltung sichtbar,</text>
  <text x="267" y="177" text-anchor="middle" class="m">bewirkt es etwas?</text>
  <circle cx="180" cy="100" r="13" class="a"/>
  <text x="180" y="104" text-anchor="middle" class="a">?</text>
  <text x="180" y="212" text-anchor="middle" class="a">Erst den Maßstab nennen, dann urteilen.</text>
  <text x="180" y="226" text-anchor="middle" class="m">„tolles Licht“ = Beobachtung, kein Urteil</text>
</svg>
