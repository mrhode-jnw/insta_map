<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 215" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- screen emits light, paper reflects it; resulting tonal range -->
  <rect x="30" y="20" width="90" height="62" rx="4"/>
  <rect x="34" y="24" width="82" height="54" class="af" stroke="none" fill-opacity="0.25"/>
  <path d="M60 82 v10 h30 v-10 M52 92 h46"/>
  <path d="M124 36 l22 -8 M126 51 h24 M124 66 l22 8" class="a"/>
  <text x="75" y="112" text-anchor="middle" class="h">Bildschirm</text>
  <text x="75" y="126" text-anchor="middle" class="m">leuchtet selbst</text>
  <!-- paper with lamp -->
  <circle cx="300" cy="22" r="7" class="a"/>
  <path d="M294 30 L262 58 M300 30 L282 58" class="a" stroke-dasharray="3 3"/>
  <rect x="230" y="60" width="90" height="26" class="f"/>
  <path d="M262 58 L239 36 M282 58 L271 36" class="m" stroke-dasharray="3 3"/>
  <text x="275" y="112" text-anchor="middle" class="h">Papier</text>
  <text x="275" y="126" text-anchor="middle" class="m">wirft Licht zurück</text>
  <!-- tonal range -->
  <text x="15" y="156" class="m">Bildschirm</text>
  <rect x="90" y="146" width="250" height="12"/>
  <rect x="90" y="146" width="250" height="12" class="f" stroke="none"/>
  <text x="15" y="186" class="m">Papier</text>
  <rect x="120" y="176" width="190" height="12"/>
  <rect x="90" y="176" width="30" height="12" class="af" stroke="none" fill-opacity="0.5"/>
  <text x="105" y="206" text-anchor="middle" class="a">Schatten laufen zu</text>
  <text x="250" y="206" text-anchor="middle" class="m">weniger Kontrast und Farbe</text>
</svg>
