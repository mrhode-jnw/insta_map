<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Feldman's four steps mapped onto Barrett's four activities -->
  <text x="70" y="20" text-anchor="middle" class="h">Feldman</text>
  <text x="290" y="20" text-anchor="middle" class="h">Barrett</text>
  <rect x="15" y="34" width="110" height="24" rx="4"/><text x="70" y="50" text-anchor="middle">Beschreibung</text>
  <rect x="15" y="80" width="110" height="24" rx="4"/><text x="70" y="96" text-anchor="middle">Analyse</text>
  <rect x="15" y="126" width="110" height="24" rx="4"/><text x="70" y="142" text-anchor="middle">Interpretation</text>
  <rect x="15" y="164" width="110" height="24" rx="4"/><text x="70" y="180" text-anchor="middle">Urteil</text>
  <text x="70" y="218" text-anchor="middle" class="m">–</text>

  <rect x="235" y="34" width="110" height="24" rx="4"/><text x="290" y="50" text-anchor="middle">Beschreiben</text>
  <text x="290" y="72" text-anchor="middle" class="m">inkl. Form, Medium,</text>
  <text x="290" y="85" text-anchor="middle" class="m">Stil, Vergleich</text>
  <rect x="235" y="126" width="110" height="24" rx="4"/><text x="290" y="142" text-anchor="middle">Deuten</text>
  <rect x="235" y="164" width="110" height="24" rx="4"/><text x="290" y="180" text-anchor="middle">Bewerten</text>
  <rect x="235" y="202" width="110" height="24" rx="4" class="a"/><text x="290" y="218" text-anchor="middle" class="a">Theoretisieren</text>

  <line x1="125" y1="46" x2="235" y2="46"/>
  <line x1="125" y1="92" x2="233" y2="52" class="a" stroke-dasharray="3 3"/>
  <text x="182" y="88" text-anchor="middle" class="a">geht auf in</text>
  <line x1="125" y1="138" x2="235" y2="138"/>
  <line x1="125" y1="176" x2="235" y2="176"/>
  <text x="180" y="210" text-anchor="middle" class="a">neu:</text>
  <text x="180" y="223" text-anchor="middle" class="a">Was ist ein Foto?</text>
</svg>
