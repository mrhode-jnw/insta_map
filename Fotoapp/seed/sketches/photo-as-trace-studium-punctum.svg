<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- studium = the whole, shared meaning; punctum = a small detail that pricks -->
  <rect x="20" y="20" width="200" height="130"/>
  <rect x="20" y="20" width="200" height="130" class="f" stroke="none"/>
  <path d="M20 100 L70 60 L100 82 L140 48 L220 98" />
  <path d="M20 118 Q120 108 220 120" class="m"/>
  <circle cx="50" cy="50" r="10" class="m"/>
  <path d="M168 132 v-8 h6 v8" />
  <circle cx="171" cy="128" r="14" class="a"/>
  <text x="235" y="50" class="h">studium</text>
  <text x="235" y="64" class="m">geteilte, kulturell</text>
  <text x="235" y="77" class="m">kodierte Bedeutung:</text>
  <text x="235" y="90" class="m">„Sonnenaufgang“</text>
  <text x="235" y="122" class="a">punctum</text>
  <text x="235" y="136" class="m">ein Detail, das</text>
  <text x="235" y="149" class="m">dich sticht</text>
  <line x1="185" y1="128" x2="230" y2="125" class="a" stroke-dasharray="2 3"/>
  <!-- time arrow: ça a été -->
  <line x1="30" y1="185" x2="320" y2="185" class="m"/>
  <path d="M314 181 l6 4 l-6 4" class="m"/>
  <circle cx="60" cy="185" r="4" class="af" stroke="none"/>
  <circle cx="290" cy="185" r="4"/>
  <text x="22" y="205">Aufnahme: dort, damals</text>
  <text x="330" y="205" text-anchor="end">Betrachten: hier</text>
  <text x="175" y="178" text-anchor="middle" class="a">„ça a été“</text>
</svg>
