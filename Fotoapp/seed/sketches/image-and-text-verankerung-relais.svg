<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <text x="90" y="16" text-anchor="middle" class="h">Verankerung</text>
  <text x="270" y="16" text-anchor="middle" class="h">Relais</text>
  <line x1="180" y1="8" x2="180" y2="240" class="m" stroke-dasharray="2 4"/>
  <!-- anchorage: image with many meanings, text picks one -->
  <rect x="40" y="30" width="100" height="64"/>
  <path d="M48 86 l20 -24 l14 12 l18 -22 l32 34" class="m"/>
  <text x="8" y="112" class="m">Lesarten</text>
  <g class="m"><circle cx="24" cy="44" r="5"/><circle cx="156" cy="44" r="5"/><circle cx="24" cy="84" r="5"/><circle cx="156" cy="84" r="5"/></g>
  <circle cx="90" cy="126" r="6" class="af" stroke="none"/>
  <line x1="90" y1="96" x2="90" y2="118" class="a"/>
  <rect x="24" y="146" width="132" height="34" rx="4" class="a"/>
  <text x="90" y="167" text-anchor="middle">„Reisbauern, Mai“</text>
  <text x="90" y="204" text-anchor="middle" class="m">Text wählt eine</text>
  <text x="90" y="218" text-anchor="middle" class="m">Bedeutung aus –</text>
  <text x="90" y="232" text-anchor="middle" class="m">für Information</text>
  <!-- relay: image + text side by side, story above both -->
  <rect x="196" y="56" width="70" height="48"/><path d="M202 98 l14 -18 l10 8 l12 -14 l22 24" class="m"/>
  <rect x="276" y="56" width="70" height="48" rx="4" class="a"/>
  <path d="M284 70 h54 M284 80 h48 M284 90 h52" class="m"/>
  <path d="M231 56 V40 H311 V56" class="a"/><circle cx="271" cy="34" r="6" class="af" stroke="none"/>
  <text x="231" y="122" text-anchor="middle" class="m">zeigt, was der</text>
  <text x="231" y="136" text-anchor="middle" class="m">Satz nicht sagt</text>
  <text x="311" y="122" text-anchor="middle" class="m">sagt, was das</text>
  <text x="311" y="136" text-anchor="middle" class="m">Bild nicht zeigt</text>
  <text x="270" y="204" text-anchor="middle" class="m">erst zusammen</text>
  <text x="270" y="218" text-anchor="middle" class="m">entsteht die</text>
  <text x="270" y="232" text-anchor="middle" class="m">Geschichte</text>
</svg>
