<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- pictorialism vs group f/64: resulting frame + depth of field side view -->
  <text x="90" y="16" text-anchor="middle" class="h">Piktorialismus</text>
  <text x="270" y="16" text-anchor="middle" class="h">Gruppe f/64</text>
  <!-- soft frame -->
  <rect x="40" y="28" width="100" height="70"/>
  <path d="M40 76 Q70 60 90 66 T140 58" class="m" stroke-width="7" stroke-opacity="0.35"/>
  <path d="M40 76 Q70 60 90 66 T140 58" class="m" stroke-width="3" stroke-opacity="0.5"/>
  <ellipse cx="70" cy="86" rx="16" ry="6" class="f" stroke="none"/>
  <ellipse cx="70" cy="86" rx="10" ry="3.5" class="f" stroke="none"/>
  <!-- sharp frame -->
  <rect x="220" y="28" width="100" height="70"/>
  <path d="M220 76 L238 58 L252 66 L270 50 L290 64 L306 54 L320 60"/>
  <path d="M228 98 L236 84 L252 80 L266 88 L272 98" class="f"/>
  <path d="M240 90 l6 -3 M252 86 l8 2 M248 94 l10 -2" class="m"/>
  <!-- side view: depth of field -->
  <line x1="20" y1="150" x2="340" y2="150" class="m"/>
  <rect x="22" y="136" width="12" height="9" class="af" stroke="none"/>
  <text x="28" y="166" text-anchor="middle" class="m">Kamera</text>
  <path d="M60 150 l6 -8 l8 8" /><text x="66" y="166" text-anchor="middle" class="m">nah</text>
  <path d="M280 150 l20 -24 l18 16 l12 8" /><text x="306" y="166" text-anchor="middle" class="m">fern</text>
  <line x1="56" y1="140" x2="334" y2="140" class="a" stroke-width="2"/>
  <text x="180" y="182" text-anchor="middle" class="a">f/64: vom Nächsten bis zum Fernsten scharf</text>
  <!-- lists -->
  <text x="90" y="208" text-anchor="middle">weichgezeichnet</text>
  <text x="90" y="223" text-anchor="middle">handbearbeitet</text>
  <text x="90" y="238" text-anchor="middle">strukturiertes Papier</text>
  <text x="270" y="208" text-anchor="middle">durchgehend scharf</text>
  <text x="270" y="223" text-anchor="middle">Kontaktabzug</text>
  <text x="270" y="238" text-anchor="middle">glänzendes Papier</text>
  <line x1="180" y1="198" x2="180" y2="244" class="m"/>
</svg>
