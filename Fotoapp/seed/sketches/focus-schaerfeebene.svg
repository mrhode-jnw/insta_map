<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <text x="180" y="16" text-anchor="middle" class="h">Schärfe stellt eine Rangordnung auf</text>
  <!-- depth of field zone -->
  <rect x="150" y="34" width="56" height="78" class="f" stroke="none"/>
  <line x1="172" y1="30" x2="172" y2="116" class="a"/>
  <text x="172" y="128" text-anchor="middle" class="a">Schärfeebene</text>
  <text x="178" y="142" text-anchor="middle" class="m">scharfe Zone</text>
  <line x1="10" y1="112" x2="350" y2="112" class="m"/>
  <rect x="14" y="80" width="12" height="9" class="af" stroke="none"/>
  <line x1="26" y1="84" x2="340" y2="84" class="m" stroke-dasharray="2 4"/>
  <!-- near tree soft -->
  <g stroke-opacity="0.45" stroke-dasharray="2 3"><line x1="84" y1="112" x2="84" y2="70"/><path d="M74 84 l10 -18 l10 18 z"/></g>
  <text x="84" y="56" text-anchor="middle" class="m">weich</text>
  <!-- person sharp on plane -->
  <line x1="172" y1="112" x2="172" y2="74"/><circle cx="172" cy="68" r="5"/><path d="M164 92 l8 -10 l8 10"/>
  <!-- far tree soft -->
  <g stroke-opacity="0.45" stroke-dasharray="2 3"><line x1="300" y1="112" x2="300" y2="64"/><path d="M288 80 l12 -22 l12 22 z"/></g>
  <text x="300" y="46" text-anchor="middle" class="m">weicher</text>
  <line x1="10" y1="156" x2="350" y2="156" class="m" stroke-dasharray="2 4"/>
  <!-- lower: same subject size, different focal length -->
  <text x="180" y="174" text-anchor="middle" class="h">Gleiche Motivgröße, gleiche Blende</text>
  <rect x="30" y="184" width="120" height="64"/>
  <g stroke-opacity="0.6">
    <path d="M36 214 h14 v-10 h14 v10"/><path d="M70 214 l8 -12 l8 12"/><path d="M96 214 h16 v-14 h12 v14"/><path d="M128 214 l6 -10 l6 10"/>
    <line x1="30" y1="214" x2="150" y2="214"/>
  </g>
  <line x1="90" y1="248" x2="90" y2="222"/><circle cx="90" cy="216" r="5"/>
  <rect x="210" y="184" width="120" height="64"/>
  <circle cx="240" cy="206" r="16" class="f" stroke="none"/>
  <circle cx="306" cy="210" r="20" class="f" stroke="none"/>
  <line x1="270" y1="248" x2="270" y2="222"/><circle cx="270" cy="216" r="5"/>
  <text x="90" y="264" text-anchor="middle">Weitwinkel, nah:</text>
  <text x="90" y="277" text-anchor="middle" class="m">viel Hintergrund</text>
  <text x="270" y="264" text-anchor="middle">Tele, weit weg:</text>
  <text x="270" y="277" text-anchor="middle" class="m">wenig, groß, weich</text>
</svg>
