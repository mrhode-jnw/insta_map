<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- left: place of shooting -->
  <text x="90" y="16" text-anchor="middle" class="h">Ort der Aufnahme</text>
  <rect x="20" y="28" width="140" height="96" rx="8" class="f" stroke="none"/>
  <rect x="20" y="28" width="140" height="96" rx="8"/>
  <!-- camera -->
  <rect x="34" y="44" width="30" height="20" rx="3"/><circle cx="49" cy="54" r="6"/><rect x="40" y="40" width="10" height="4" class="mf" stroke="none"/>
  <text x="74" y="52" class="m">Recht des</text>
  <text x="74" y="65" class="m">Landes</text>
  <text x="34" y="88">Hausrecht, Tempel</text>
  <text x="34" y="102">Schilder, Wächter</text>
  <text x="34" y="116" class="a">„Nein“ = Antwort</text>
  <!-- arrow -->
  <line x1="166" y1="76" x2="194" y2="76" class="a"/><path d="M188 71 L195 76 L188 81" class="a"/>
  <!-- right: place of publication -->
  <text x="270" y="16" text-anchor="middle" class="h">Ort der Veröffentl.</text>
  <rect x="200" y="28" width="140" height="96" rx="8" class="f" stroke="none"/>
  <rect x="200" y="28" width="140" height="96" rx="8"/>
  <!-- frame / screen -->
  <rect x="214" y="42" width="30" height="24" rx="2"/><path d="M218 62 l7 -9 l6 6 l4 -4 l6 7" class="m"/>
  <text x="254" y="52" class="m">z. B.</text>
  <text x="254" y="65" class="m">Deutschland</text>
  <text x="214" y="88">§§ 22/23 KUG</text>
  <text x="214" y="102">§ 59 UrhG</text>
  <text x="214" y="116" class="m">(Zeigen, Verbreiten)</text>
  <!-- bottom -->
  <line x1="90" y1="132" x2="90" y2="148" class="m"/><line x1="270" y1="132" x2="270" y2="148" class="m"/>
  <line x1="90" y1="148" x2="270" y2="148" class="m"/><line x1="180" y1="148" x2="180" y2="158" class="m"/>
  <text x="180" y="174" text-anchor="middle" class="h">Beide gelten.</text>
  <text x="180" y="190" text-anchor="middle" class="m">Vor der Reise nachlesen, mit Datum notieren.</text>
</svg>
