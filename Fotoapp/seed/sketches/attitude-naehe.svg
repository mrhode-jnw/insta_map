<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 195" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <text x="90" y="16" text-anchor="middle" class="h">Nah per Tele</text>
  <text x="270" y="16" text-anchor="middle" class="h">Nah durch Zeit</text>
  <line x1="180" y1="26" x2="180" y2="188" class="m" stroke-dasharray="2 4"/>
  <!-- tele from afar: person turned away -->
  <line x1="10" y1="100" x2="172" y2="100" class="m"/>
  <rect x="12" y="82" width="10" height="7" class="af" stroke="none"/>
  <path d="M22 84 h10" stroke-width="3" class="a"/>
  <line x1="34" y1="85" x2="146" y2="80" class="a" stroke-dasharray="3 3"/>
  <line x1="150" y1="100" x2="150" y2="80"/><circle cx="150" cy="75" r="5"/>
  <path d="M155 75 l6 0" />
  <text x="90" y="124" text-anchor="middle" class="m">groß im Bild,</text>
  <text x="90" y="138" text-anchor="middle" class="m">Person weiß nichts</text>
  <!-- time: tripod camera close, person facing, several days -->
  <line x1="188" y1="100" x2="352" y2="100" class="m"/>
  <rect x="226" y="66" width="16" height="12" class="af" stroke="none"/>
  <path d="M234 78 l-8 22 M234 78 v22 M234 78 l8 22" class="m"/>
  <line x1="244" y1="72" x2="290" y2="72" class="a" stroke-dasharray="3 3"/>
  <line x1="300" y1="100" x2="300" y2="80"/><circle cx="300" cy="75" r="5"/>
  <path d="M295 75 l-6 0"/>
  <path d="M318 46 h28 v16 h-18 l-6 6 v-6 h-4 z" class="m"/>
  <text x="270" y="124" text-anchor="middle" class="m">Stativ, Erlaubnis,</text>
  <text x="270" y="138" text-anchor="middle" class="m">Gegenüber blickt zurück</text>
  <!-- time bar -->
  <path d="M206 162 h128" class="a"/>
  <path d="M206 158 v8 M238 158 v8 M270 158 v8 M302 158 v8 M334 158 v8" class="a"/>
  <text x="270" y="182" text-anchor="middle" class="a">Tage, Nächte, Gespräche</text>
  <path d="M30 162 h120" class="m"/>
  <path d="M30 158 v8 M150 158 v8" class="m"/>
  <text x="90" y="182" text-anchor="middle" class="m">1/500 s</text>
</svg>
