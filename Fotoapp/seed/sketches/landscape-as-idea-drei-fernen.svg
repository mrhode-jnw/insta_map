<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 215" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Guo Xi's three distances as side views; small figure = viewer -->
  <text x="60" y="16" text-anchor="middle" class="h">hohe Ferne</text>
  <text x="180" y="16" text-anchor="middle" class="h">tiefe Ferne</text>
  <text x="300" y="16" text-anchor="middle" class="h">ebene Ferne</text>
  <line x1="5" y1="140" x2="355" y2="140" class="m"/>
  <!-- high distance: viewer at foot, looking up -->
  <path d="M40 140 L70 34 L104 140" class="f"/>
  <line x1="20" y1="140" x2="20" y2="124"/><circle cx="20" cy="120" r="3.5"/>
  <path d="M24 120 L68 40" class="a" stroke-dasharray="3 3"/>
  <!-- deep distance: viewer in front, ranges behind ranges -->
  <path d="M158 140 L178 92 L196 140" class="f"/>
  <path d="M176 140 L200 74 L226 140" class="f" style="fill-opacity:0.06"/>
  <path d="M196 140 L220 58 L240 140" class="m"/>
  <line x1="134" y1="140" x2="134" y2="124"/><circle cx="134" cy="120" r="3.5"/>
  <path d="M138 118 L218 62" class="a" stroke-dasharray="3 3"/>
  <!-- level distance: from a mountain out over low hills -->
  <path d="M250 140 L266 96 L282 140" class="f"/>
  <line x1="266" y1="96" x2="266" y2="82"/><circle cx="266" cy="78" r="3.5"/>
  <path d="M282 140 q10 -12 20 0 q10 -10 20 0 q10 -8 20 0 q6 -5 12 0" class="m"/>
  <path d="M270 80 L352 128" class="a" stroke-dasharray="3 3"/>
  <text x="60" y="162" text-anchor="middle" class="m">von unten</text>
  <text x="60" y="176" text-anchor="middle" class="m">zum Berg hinauf</text>
  <text x="180" y="162" text-anchor="middle" class="m">von vorn auf den Berg</text>
  <text x="180" y="176" text-anchor="middle" class="m">und die Berge dahinter</text>
  <text x="300" y="162" text-anchor="middle" class="m">vom Berg hinaus</text>
  <text x="300" y="176" text-anchor="middle" class="m">auf niedrige Hügel</text>
  <text x="180" y="204" text-anchor="middle" class="a">Guo Xi, 11. Jh.</text>
</svg>
