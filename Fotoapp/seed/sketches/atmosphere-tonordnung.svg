<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <text x="60" y="16" text-anchor="middle" class="h">Gewohnt</text>
  <text x="180" y="16" text-anchor="middle" class="h">Rand des Wetters</text>
  <text x="300" y="16" text-anchor="middle" class="h">Wolkenschatten</text>
  <g stroke="none">
    <!-- 1: bright sky, dark land -->
    <rect x="10" y="28" width="100" height="44" fill="#e9e7e2"/>
    <rect x="10" y="72" width="100" height="44" fill="#5b5a56"/>
    <path d="M50 72 v-14 h8 v14 Z M54 58 l0 -6" fill="#3c3b38"/>
    <!-- 2: dark sky, lit land -->
    <rect x="130" y="28" width="100" height="44" fill="#3a3e46"/>
    <rect x="130" y="72" width="100" height="44" fill="#c9b48a"/>
    <path d="M170 72 v-14 h8 v14 Z" fill="#f2ead8"/>
    <path d="M174 58 l0 -6" stroke="#f2ead8" stroke-width="1.5"/>
    <!-- 3: patchy light on the land -->
    <rect x="250" y="28" width="100" height="44" fill="#9aa6b2"/>
    <rect x="250" y="72" width="100" height="44" fill="#4d5246"/>
    <path d="M268 84 Q284 70 306 74 Q330 72 334 88 Q338 104 314 108 Q290 114 276 104 Q262 96 268 84 Z" fill="#b9b06e"/>
    <path d="M296 72 v-14 h8 v14 Z" fill="#f2ead8"/>
    <path d="M300 58 l0 -6" stroke="#f2ead8" stroke-width="1.5"/>
    <ellipse cx="300" cy="40" rx="36" ry="8" fill="#6c7682"/>
  </g>
  <rect x="10" y="28" width="100" height="88"/>
  <rect x="130" y="28" width="100" height="88"/>
  <rect x="250" y="28" width="100" height="88"/>
  <!-- light arrows -->
  <path d="M216 34 L190 52 M190 52 l7 -1 M190 52 l1 -7" class="a"/>
  <path d="M338 32 L316 50 M316 50 l7 -1 M316 50 l1 -7" class="a"/>

  <text x="60" y="136" text-anchor="middle" class="m">Himmel hell,</text>
  <text x="60" y="150" text-anchor="middle" class="m">Boden dunkel</text>
  <text x="180" y="136" text-anchor="middle" class="m">Himmel dunkel,</text>
  <text x="180" y="150" text-anchor="middle" class="m">Besonntes leuchtet</text>
  <text x="300" y="136" text-anchor="middle" class="m">Lichtfleck auf</text>
  <text x="300" y="150" text-anchor="middle" class="m">dem Schlüsselmotiv</text>
  <text x="180" y="178" text-anchor="middle" class="a">Ordnung kippt</text>
  <text x="300" y="178" text-anchor="middle" class="a">abwarten, auslösen</text>
</svg>
