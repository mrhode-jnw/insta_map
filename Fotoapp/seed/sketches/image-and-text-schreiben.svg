<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <text x="10" y="16" class="h">Schreiben vor, während, nach</text>
  <!-- three nodes on an arc -->
  <rect x="10" y="40" width="100" height="54" rx="6"/><rect x="130" y="40" width="100" height="54" rx="6" class="f" stroke="none"/><rect x="130" y="40" width="100" height="54" rx="6"/><rect x="250" y="40" width="100" height="54" rx="6"/>
  <line x1="110" y1="67" x2="126" y2="67" class="a"/><path d="M121 63 L127 67 L121 71" class="a"/>
  <line x1="230" y1="67" x2="246" y2="67" class="a"/><path d="M241 63 L247 67 L241 71" class="a"/>
  <text x="60" y="60" text-anchor="middle" class="a">vor der Reise</text><text x="60" y="78" text-anchor="middle">Statement-</text><text x="60" y="90" text-anchor="middle">Entwurf</text>
  <text x="180" y="60" text-anchor="middle" class="a">unterwegs</text><text x="180" y="78" text-anchor="middle">fotografieren</text>
  <text x="300" y="60" text-anchor="middle" class="a">danach</text><text x="300" y="78" text-anchor="middle">sachliche</text><text x="300" y="90" text-anchor="middle">Unterschrift</text>
  <text x="60" y="114" text-anchor="middle" class="m">= Projektfrage</text>
  <text x="300" y="114" text-anchor="middle" class="m">= Prüfung</text>
  <path d="M300 124 v20 H60 v-20" class="m" stroke-dasharray="3 3"/>
  <text x="180" y="166" text-anchor="middle">Zeigt das Bild es – oder weiß ich es nur?</text>
  <text x="180" y="186" text-anchor="middle" class="m">Braucht es den Text, ist es ein Dokument.</text>
</svg>
