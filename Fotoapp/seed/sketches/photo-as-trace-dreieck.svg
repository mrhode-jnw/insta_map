  <circle cx="180" cy="52" r="6" class="af" stroke="none"/>
  <circle cx="78" cy="168" r="6" class="af" stroke="none"/>
  <circle cx="282" cy="168" r="6" class="af" stroke="none"/>
  <text x="180" y="16" text-anchor="middle" class="h">Spur</text>
