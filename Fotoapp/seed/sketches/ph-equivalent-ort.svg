<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- the dividing line inside the group: weaken the place vs charge it with meaning -->
  <text x="90" y="16" text-anchor="middle" class="h">Ort schwächen</text>
  <text x="270" y="16" text-anchor="middle" class="h">Ort aufladen</text>
  <!-- icons: frame without horizon vs frame with place -->
  <rect x="60" y="28" width="60" height="40"/>
  <path d="M66 62 C78 40 92 60 104 36 M74 66 C84 52 96 64 114 46" class="m"/>
  <rect x="240" y="28" width="60" height="40"/>
  <path d="M240 52 h60" class="m"/>
  <path d="M256 52 v-12 M262 52 v-16 M268 52 v-10" />
  <path d="M276 68 L284 52" class="a"/>
  <line x1="180" y1="26" x2="180" y2="216" class="m" stroke-dasharray="3 4"/>
  <g>
    <text x="16" y="100" class="h">White</text><text x="16" y="114" class="m">kein Horizont, Zeichen</text>
    <text x="16" y="142" class="h">Barnbaum</text><text x="16" y="156" class="m">Größe, Richtung offen</text>
    <text x="16" y="184" class="h">Giacomelli</text><text x="16" y="198" class="m">Feld als Kalligrafie</text>
    <text x="196" y="100" class="h">Bullock</text><text x="196" y="114" class="m">Zeit, Ereignis</text>
    <text x="196" y="142" class="h">Caponigro</text><text x="196" y="156" class="m">heiliger Ort, Steine</text>
    <text x="196" y="184" class="h">Godwin</text><text x="196" y="198" class="m">Weg, Mauer, Zugang</text>
  </g>
</svg>
