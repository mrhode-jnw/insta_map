  <text x="10" y="32" class="m">sieht nur die Bilder – keine Mühe, kein Erlebnis</text>
  <!-- grid 6x3 -->
  <g class="m">
    <rect x="10" y="48" width="34" height="24"/><rect x="50" y="48" width="34" height="24"/><rect x="90" y="48" width="34" height="24"/><rect x="130" y="48" width="34" height="24"/><rect x="170" y="48" width="34" height="24"/><rect x="210" y="48" width="34" height="24"/>
    <rect x="10" y="80" width="34" height="24"/><rect x="50" y="80" width="34" height="24"/><rect x="90" y="80" width="34" height="24"/><rect x="130" y="80" width="34" height="24"/><rect x="170" y="80" width="34" height="24"/><rect x="210" y="80" width="34" height="24"/>
    <rect x="10" y="112" width="34" height="24"/><rect x="50" y="112" width="34" height="24"/><rect x="90" y="112" width="34" height="24"/><rect x="130" y="112" width="34" height="24"/><rect x="170" y="112" width="34" height="24"/><rect x="210" y="112" width="34" height="24"/>
