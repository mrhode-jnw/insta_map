<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 360 246" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- side view: four camera positions toward the same kind of building, with the frame each produces -->
  <line x1="6" y1="160" x2="354" y2="160" class="m"/>
  <path d="M6 160 L30 96 L74 96 L96 160" class="m"/>
  <rect x="300" y="104" width="44" height="56"/>
  <path d="M308 116 h10 v10 h-10 Z M326 116 h10 v10 h-10 Z" class="m"/>
  <!-- cameras -->
  <rect x="44" y="84" width="10" height="7" class="af" stroke="none"/>
  <line x1="54" y1="90" x2="298" y2="140" class="a" stroke-dasharray="3 3"/>
  <rect x="150" y="140" width="10" height="7" class="af" stroke="none"/>
  <line x1="160" y1="143" x2="298" y2="138" class="a" stroke-dasharray="3 3"/>
  <line x1="215" y1="160" x2="215" y2="128" class="m"/>
  <rect x="210" y="120" width="10" height="7" class="af" stroke="none"/>
  <line x1="220" y1="124" x2="298" y2="130" class="a" stroke-dasharray="3 3"/>
  <rect x="270" y="134" width="10" height="7" class="af" stroke="none"/>
  <line x1="280" y1="137" x2="298" y2="137" class="a" stroke-dasharray="3 3"/>
  <text x="50" y="76" text-anchor="middle" class="h">Sternfeld</text>
  <text x="155" y="132" text-anchor="middle" class="h">Shore</text>
  <text x="215" y="112" text-anchor="middle" class="h">Becher</text>
  <text x="275" y="178" text-anchor="middle" class="h">Baltz</text>
  <line x1="275" y1="160" x2="275" y2="141" class="m"/>
  <!-- resulting frames -->
  <g transform="translate(0,200)">
    <rect x="8" y="0" width="76" height="54"/>
    <path d="M8 22 h76" class="m"/>
    <!-- camera higher than the roof: the building sits below the horizon -->
    <rect x="50" y="26" width="8" height="6"/>
    <circle cx="30" cy="38" r="2" class="af" stroke="none"/>
    <rect x="96" y="0" width="76" height="54"/>
    <!-- eye level: all lines run to a vanishing point a little above the base of the far building -->
    <path d="M96 54 L127.4 27 M172 54 L137.2 27 M96 6 L122 18.3 M172 4 L142 18.3" class="m"/>
    <rect x="122" y="13" width="20" height="14"/>
    <rect x="184" y="0" width="76" height="54"/>
    <rect x="208" y="10" width="28" height="38"/>
    <path d="M214 18 h6 v6 h-6 Z M224 18 h6 v6 h-6 Z" class="m"/>
    <rect x="272" y="0" width="76" height="54"/>
    <path d="M286 10 h12 v12 h-12 Z M316 10 h12 v12 h-12 Z" />
    <circle cx="310" cy="44" r="3" class="m"/>
    <text x="46" y="72" text-anchor="middle" class="m">hoch, weit weg</text>
    <text x="46" y="86" text-anchor="middle" class="m">Ereignis klein</text>
    <text x="134" y="72" text-anchor="middle" class="m">Augenhöhe</text>
    <text x="134" y="86" text-anchor="middle" class="m">Raum, Tiefe</text>
    <text x="222" y="72" text-anchor="middle" class="m">frontal, erhöht</text>
    <text x="222" y="86" text-anchor="middle" class="m">freigestellt</text>
    <text x="310" y="72" text-anchor="middle" class="m">nah an der Wand</text>
    <text x="310" y="86" text-anchor="middle" class="m">keine Tiefe</text>
  </g>
</svg>
