  <text x="113" y="101" text-anchor="middle">Negativ</text><text x="113" y="115" text-anchor="middle" class="m">= Partitur</text>
  <rect x="200" y="84" width="110" height="40" rx="6" class="a"/>
  <text x="255" y="101" text-anchor="middle">Abzug</text><text x="255" y="115" text-anchor="middle" class="m">= Aufführung</text>
  <path d="M170 104 h26 M191 99 l5 5 l-5 5" class="m"/>
