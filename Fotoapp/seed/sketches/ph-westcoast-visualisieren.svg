<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Adams' visualisation as a method map + schematic tone scale -->
  <rect x="8" y="10" width="100" height="40" rx="6"/>
  <text x="58" y="27" text-anchor="middle">Motiv</text><text x="58" y="41" text-anchor="middle">sehen</text>
  <rect x="130" y="10" width="100" height="40" rx="6" class="a"/>
  <text x="180" y="27" text-anchor="middle" class="a">fertigen Abzug</text><text x="180" y="41" text-anchor="middle" class="a">vorstellen</text>
  <rect x="252" y="10" width="100" height="40" rx="6"/>
  <text x="302" y="27" text-anchor="middle">Belichtung +</text><text x="302" y="41" text-anchor="middle">Entwicklung</text>
  <path d="M110 30 h16 M121 25 l5 5 l-5 5 M232 30 h16 M243 25 l5 5 l-5 5" class="m"/>
