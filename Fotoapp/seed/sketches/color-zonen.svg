  <g stroke="none">
    <rect x="10" y="78" width="31" height="26" fill="#000"/><rect x="41" y="78" width="31" height="26" fill="#161616"/><rect x="72" y="78" width="31" height="26" fill="#2b2b2b"/><rect x="103" y="78" width="31" height="26" fill="#424242"/><rect x="134" y="78" width="31" height="26" fill="#5c5c5c"/><rect x="165" y="78" width="30" height="26" fill="#777"/><rect x="195" y="78" width="31" height="26" fill="#949494"/><rect x="226" y="78" width="31" height="26" fill="#b1b1b1"/><rect x="257" y="78" width="31" height="26" fill="#cdcdcd"/><rect x="288" y="78" width="31" height="26" fill="#e6e6e6"/><rect x="319" y="78" width="31" height="26" fill="#fff"/>
