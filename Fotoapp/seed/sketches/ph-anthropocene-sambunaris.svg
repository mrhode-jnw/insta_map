  <line x1="20" y1="148" x2="340" y2="148" class="m"/>
  <text x="180" y="168" text-anchor="middle" class="a">frontal · scharf · gleiches Licht</text>
  <text x="180" y="183" text-anchor="middle" class="m">= als Serie lesbar</text>
