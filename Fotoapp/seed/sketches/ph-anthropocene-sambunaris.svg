  <rect x="122" y="40" width="28" height="24" rx="2"/><circle cx="136" cy="52" r="7"/><rect x="128" y="34" width="10" height="6"/>
  <!-- 3 waiting for diffuse light -->
  <circle cx="232" cy="40" r="7" class="m"/>
  <path d="M210 62 a9 9 0 0 1 4 -17 a12 12 0 0 1 22 -2 a9 9 0 0 1 4 19 z" class="f"/>
  
  <!-- 4 two sheets of film -->
  <rect x="300" y="34" width="22" height="31" class="f"/><rect x="308" y="40" width="22" height="31"/>
  <!-- arrows -->
  <path d="M74 54 h26 m-5 -4 l5 4 l-5 4 M164 54 h26 m-5 -4 l5 4 l-5 4 M254 54 h26 m-5 -4 l5 4 l-5 4" class="a"/>
  <g text-anchor="middle">
    <text x="45" y="102" class="h">Recherche</text>
    <text x="45" y="117" class="m">Karten, Bücher,</text>
    <text x="45" y="131" class="m">Gespräche</text>
    <text x="136" y="102" class="h">Erkunden</text>
