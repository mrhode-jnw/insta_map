<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <text x="90" y="16" text-anchor="middle" class="h">Motiv</text>
  <text x="270" y="16" text-anchor="middle" class="h">Fragestellung</text>
  <line x1="180" y1="8" x2="180" y2="150" class="m" stroke-dasharray="2 4"/>
  <!-- motif: one frame, one object, check -->
  <rect x="50" y="34" width="80" height="56"/>
  <path d="M58 82 l14 -26 l10 14 l12 -22 l14 22 l12 12" class="m"/>
  <text x="90" y="112" text-anchor="middle" class="m">„Karstberge“</text>
  <text x="90" y="128" text-anchor="middle" class="m">ein Bild – erledigt</text>
  <!-- question: ? leading to many frames -->
  <circle cx="214" cy="62" r="16" class="a"/><text x="214" y="67" text-anchor="middle" class="a">?</text>
  <line x1="230" y1="56" x2="262" y2="40" class="a"/><line x1="230" y1="62" x2="262" y2="62" class="a"/><line x1="230" y1="68" x2="262" y2="84" class="a"/>
  <rect x="266" y="32" width="28" height="18"/><rect x="300" y="32" width="28" height="18"/>
  <rect x="266" y="54" width="28" height="18"/><rect x="300" y="54" width="28" height="18"/>
  <rect x="266" y="76" width="28" height="18"/><rect x="300" y="76" width="28" height="18" class="m" stroke-dasharray="2 2"/>
  <text x="270" y="112" text-anchor="middle" class="m">eine Spannung,</text>
  <text x="270" y="128" text-anchor="middle" class="m">viele Bilder nötig</text>
  <!-- three tests -->
  <line x1="10" y1="158" x2="350" y2="158" class="m"/>
  <text x="10" y="178" class="h">Test der Projektfrage</text>
  <circle cx="18" cy="198" r="5" class="af" stroke="none"/><text x="30" y="202" class="a">sichtbar</text><text x="92" y="202">ein Bild kann etwas beitragen</text>
  <circle cx="18" cy="216" r="5" class="af" stroke="none"/><text x="30" y="220" class="a">offen</text><text x="92" y="220">nicht mit einem Bild erledigt</text>
  <circle cx="18" cy="234" r="5" class="af" stroke="none"/><text x="30" y="238" class="a">eigen</text><text x="92" y="238">aus deinem Interesse, keine Liste</text>
</svg>
