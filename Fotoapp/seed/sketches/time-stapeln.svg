  <path d="M230 92 v-36 l18 -10 l18 10 v36"/>
  <g class="m" stroke-dasharray="2 3" stroke-opacity="0.5"><circle cx="292" cy="66" r="3"/><path d="M292 70 v12"/><circle cx="312" cy="70" r="3"/><path d="M312 74 v12"/></g>
  <path d="M286 60 l32 32 M318 60 l-32 32" class="a"/>
