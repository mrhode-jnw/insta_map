  <rect x="185" y="125" width="165" height="105" class="m"/>
  <text x="195" y="143" class="h">Tag-Nacht-Blende</text>
  <rect x="200" y="152" width="135" height="50" class="m"/>
  <path d="M200 202 L335 152 L335 202 Z" class="mf" stroke="none"/>
  <circle cx="226" cy="166" r="6"/><path d="M300 170 l3 -6 l3 6" class="af" stroke="none"/>
