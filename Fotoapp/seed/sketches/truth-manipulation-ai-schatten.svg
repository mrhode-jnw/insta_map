<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- physics check: one sun gives parallel shadows. Sun low from the side (outside the frame), so ground shadows run parallel to the image plane; shadow length ∝ pole height (same sun elevation) -->
  <text x="90" y="16" text-anchor="middle" class="h">stimmig</text>
  <text x="270" y="16" text-anchor="middle" class="a">verdächtig</text>
  <rect x="15" y="26" width="150" height="110"/>
  <text x="22" y="44" class="a">Sonne →</text>
  <line x1="15" y1="96" x2="165" y2="96" class="m"/>
  <line x1="60" y1="112" x2="60" y2="70"/><line x1="60" y1="112" x2="110" y2="112" class="m" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="115" y1="104" x2="115" y2="66"/><line x1="115" y1="104" x2="160" y2="104" class="m" stroke-width="4" stroke-opacity="0.6"/>
  <rect x="195" y="26" width="150" height="110" class="a"/>
  <text x="202" y="44" class="a">Sonne →</text>
  <text x="338" y="44" text-anchor="end" class="a">← Sonne?</text>
  <line x1="195" y1="96" x2="345" y2="96" class="m"/>
  <line x1="250" y1="112" x2="250" y2="70"/><line x1="250" y1="112" x2="200" y2="112" class="m" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="295" y1="104" x2="295" y2="66"/><line x1="295" y1="104" x2="340" y2="104" class="m" stroke-width="4" stroke-opacity="0.6"/>
  <text x="90" y="156" text-anchor="middle" class="m">eine Sonne:</text>
  <text x="90" y="170" text-anchor="middle" class="m">Schatten parallel</text>
  <text x="270" y="156" text-anchor="middle" class="m">Schatten laufen</text>
  <text x="270" y="170" text-anchor="middle" class="m">auseinander: zwei Sonnen?</text>
  <text x="180" y="188" text-anchor="middle" class="a">ein Verdacht, kein Beweis</text>
</svg>
