<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- six roles colour can play, one mini frame each -->
  <!-- Haas: sensation -->
  <rect x="14" y="10" width="96" height="64" fill="#1f4e79" stroke="none"/>
  <path d="M14 40 q16 -14 32 0 t32 0 t32 0" stroke="#7fc8f8" stroke-width="3"/>
  <path d="M14 54 q16 -10 32 0 t32 0 t32 0" stroke="#3f8fc4" stroke-width="3"/>
  <rect x="14" y="10" width="96" height="64"/>
  <text x="62" y="92" text-anchor="middle" class="h">Empfindung</text><text x="62" y="106" text-anchor="middle" class="m">Haas</text>
  <!-- Eggleston: thing -->
  <rect x="132" y="10" width="96" height="64" fill="#cfe3f0" stroke="none"/>
  <rect x="132" y="56" width="96" height="18" fill="#b9b2a4" stroke="none"/>
  <line x1="180" y1="74" x2="180" y2="34" stroke="#555"/>
  <circle cx="180" cy="30" r="8" fill="#d7261e" stroke="none"/>
  <rect x="132" y="10" width="96" height="64"/>
  <text x="180" y="92" text-anchor="middle" class="h">Ding</text><text x="180" y="106" text-anchor="middle" class="m">Eggleston</text>
  <!-- Meyerowitz: light -->
  <rect x="250" y="10" width="96" height="64" fill="#2b3550" stroke="none"/>
  <rect x="250" y="52" width="96" height="22" fill="#3d4a5c" stroke="none"/>
  <rect x="268" y="30" width="22" height="22" fill="#f2b84b" stroke="none"/>
  <rect x="300" y="30" width="22" height="22" fill="#f2b84b" stroke="none"/>
  <path d="M250 52 h96" stroke="#9fb3c8"/>
  <rect x="250" y="10" width="96" height="64"/>
  <text x="298" y="92" text-anchor="middle" class="h">Licht</text><text x="298" y="106" text-anchor="middle" class="m">Meyerowitz</text>
  <!-- Fontana: plane -->
  <rect x="14" y="132" width="96" height="22" fill="#2d6cc0" stroke="none"/>
  <rect x="14" y="154" width="96" height="20" fill="#3f8a3a" stroke="none"/>
  <rect x="14" y="174" width="96" height="2" fill="#d7261e" stroke="none"/>
  <rect x="14" y="176" width="96" height="20" fill="#e3c13b" stroke="none"/>
  <rect x="14" y="132" width="96" height="64"/>
  <text x="62" y="214" text-anchor="middle" class="h">Fläche</text><text x="62" y="228" text-anchor="middle" class="m">Fontana</text>
  <!-- Ghirri: sign -->
  <rect x="132" y="132" width="96" height="64" fill="#efe6d6" stroke="none"/>
  <rect x="150" y="142" width="44" height="32" fill="#f4a261" stroke="none"/>
  <circle cx="172" cy="162" r="7" fill="#e76f51" stroke="none"/>
  <rect x="150" y="142" width="44" height="32" stroke="#777"/>
  <line x1="210" y1="196" x2="210" y2="184" stroke="#555"/><circle cx="210" cy="181" r="2.5" fill="#555" stroke="none"/>
  <rect x="132" y="132" width="96" height="64"/>
  <text x="180" y="214" text-anchor="middle" class="h">Zeichen</text><text x="180" y="228" text-anchor="middle" class="m">Ghirri</text>
  <!-- Gruyaert/Webb: event -->
  <rect x="250" y="132" width="96" height="64" fill="#e08a2e" stroke="none"/>
  <path d="M250 196 L250 160 L300 196 Z" fill="#3a1f12" stroke="none"/>
  <rect x="316" y="132" width="30" height="64" fill="#2a6f97" stroke="none"/>
  <line x1="290" y1="196" x2="290" y2="168" stroke="#1a1a1a" stroke-width="3"/><circle cx="290" cy="164" r="4" fill="#1a1a1a" stroke="none"/>
  <rect x="250" y="132" width="96" height="64"/>
  <text x="298" y="214" text-anchor="middle" class="h">Ereignis</text><text x="298" y="228" text-anchor="middle" class="m">Gruyaert, Webb</text>
  <text x="180" y="254" text-anchor="middle" class="m">Welche Rolle hat die Farbe in deinem Bild?</text>
</svg>
