<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <text x="60" y="16" text-anchor="middle" class="h">Optisch</text>
  <text x="180" y="16" text-anchor="middle" class="h">Bewegung</text>
  <text x="300" y="16" text-anchor="middle" class="h">Dunst</text>
  <!-- optical: points become discs, size grows with distance from focus plane -->
  <rect x="15" y="26" width="90" height="70"/>
  <circle cx="34" cy="48" r="2.5" class="af" stroke="none"/>
  <circle cx="56" cy="62" r="8" class="f m"/>
  <circle cx="84" cy="74" r="14" class="f m"/>
  <!-- motion: moving dot smears in one direction, fixed post stays sharp -->
  <rect x="135" y="26" width="90" height="70"/>
  <line x1="148" y1="62" x2="196" y2="62" stroke-width="9" stroke-opacity="0.25"/>
  <circle cx="196" cy="62" r="4.5" class="af" stroke="none"/>
  <path d="M200 50 l12 0 m-4 -3 l4 3 l-4 3" class="a"/>
  <line x1="214" y1="92" x2="214" y2="70"/><line x1="208" y1="70" x2="220" y2="70"/>
  <!-- haze: ridges lose contrast with distance -->
  <rect x="255" y="26" width="90" height="70"/>
  <path d="M255 60 l18 -12 l16 8 l20 -14 l18 10 l18 -6" stroke-opacity="0.25"/>
  <path d="M255 72 l22 -10 l20 6 l18 -10 l22 12 l8 -4" stroke-opacity="0.55"/>
  <path d="M255 96 v-14 l26 -8 l22 10 l20 -12 l22 14 v10 z" class="f"/>
  <text x="60" y="112" text-anchor="middle" class="m">Punkt → Scheibe</text>
  <text x="60" y="126" text-anchor="middle" class="m">ohne Richtung</text>
  <text x="180" y="112" text-anchor="middle" class="m">Spur mit Richtung</text>
  <text x="180" y="126" text-anchor="middle" class="m">nur was sich bewegt</text>
  <text x="300" y="112" text-anchor="middle" class="m">Kontrast sinkt</text>
  <text x="300" y="126" text-anchor="middle" class="m">mit Entfernung</text>
  <!-- diagnosis strip -->
  <line x1="10" y1="142" x2="350" y2="142" class="m" stroke-dasharray="2 4"/>
  <text x="180" y="162" text-anchor="middle" class="h">Das Muster verrät die Ursache</text>
  <line x1="20" y1="214" x2="300" y2="214" class="m"/>
  <rect x="14" y="196" width="10" height="7" class="af" stroke="none"/>
  <!-- front trees sharp -->
  <line x1="60" y1="214" x2="60" y2="180"/><path d="M52 190 l8 -14 l8 14 z"/>
  <line x1="90" y1="214" x2="90" y2="184"/><path d="M83 193 l7 -12 l7 12 z"/>
  <!-- middle trees soft -->
  <g stroke-opacity="0.45" stroke-dasharray="2 3">
    <line x1="140" y1="214" x2="140" y2="182"/><path d="M132 192 l8 -14 l8 14 z"/>
    <line x1="170" y1="214" x2="170" y2="184"/><path d="M163 193 l7 -12 l7 12 z"/>
  </g>
  <!-- back trees sharp -->
  <line x1="225" y1="214" x2="225" y2="186"/><path d="M219 194 l6 -10 l6 10 z"/>
  <line x1="250" y1="214" x2="250" y2="188"/><path d="M245 195 l5 -9 l5 9 z"/>
  <text x="75" y="230" text-anchor="middle">scharf</text>
  <text x="155" y="230" text-anchor="middle" class="m">weich</text>
  <text x="237" y="230" text-anchor="middle">scharf</text>
  <text x="330" y="196" text-anchor="middle" class="a">Wind,</text>
  <text x="330" y="210" text-anchor="middle" class="a">nicht</text>
  <text x="330" y="224" text-anchor="middle" class="a">Fokus</text>
  <text x="180" y="254" text-anchor="middle" class="m">Optische Unschärfe wächst stetig mit dem Abstand</text>
</svg>
