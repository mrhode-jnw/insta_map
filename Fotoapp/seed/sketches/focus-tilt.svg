<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <text x="60" y="16" text-anchor="middle" class="h">ohne Tilt</text>
  <text x="180" y="16" text-anchor="middle" class="h">Tilt</text>
  <text x="300" y="16" text-anchor="middle" class="h">Gegen-Tilt</text>
  <!-- side views: camera on the left, ground runs into depth -->
  <g>
    <line x1="10" y1="96" x2="110" y2="96" class="m"/>
    <rect x="12" y="44" width="10" height="8" class="af" stroke="none"/>
    <line x1="62" y1="30" x2="62" y2="100" class="a"/>
    <circle cx="40" cy="93" r="3" class="m" stroke-dasharray="2 2"/><circle cx="62" cy="93" r="3"/><circle cx="84" cy="93" r="3" class="m" stroke-dasharray="2 2"/><circle cx="104" cy="93" r="3" class="m" stroke-dasharray="2 2"/>

    <line x1="130" y1="96" x2="230" y2="96" class="m"/>
    <rect x="132" y="44" width="10" height="8" class="af" stroke="none"/>
    <line x1="140" y1="98" x2="230" y2="88" class="a"/>
    <circle cx="160" cy="93" r="3"/><circle cx="182" cy="93" r="3"/><circle cx="204" cy="93" r="3"/><circle cx="224" cy="93" r="3"/>

    <line x1="250" y1="96" x2="350" y2="96" class="m"/>
    <rect x="252" y="44" width="10" height="8" class="af" stroke="none"/>
    <line x1="292" y1="104" x2="318" y2="30" class="a"/>
    <circle cx="280" cy="93" r="3" class="m" stroke-dasharray="2 2"/><circle cx="302" cy="93" r="3"/><circle cx="324" cy="93" r="3" class="m" stroke-dasharray="2 2"/><circle cx="344" cy="93" r="3" class="m" stroke-dasharray="2 2"/>
  </g>
  <!-- resulting frames: sharp area shaded -->
  <g>
    <rect x="15" y="120" width="90" height="60"/>
    <rect x="15" y="148" width="90" height="14" class="f" stroke="none"/>
    <rect x="135" y="120" width="90" height="60"/>
    <rect x="135" y="120" width="90" height="60" class="f" stroke="none"/>
    <rect x="255" y="120" width="90" height="60"/>
    <rect x="255" y="152" width="90" height="5" class="f" stroke="none"/>
  </g>
  <text x="60" y="198" text-anchor="middle" class="m">Ebene steht quer:</text>
  <text x="60" y="212" text-anchor="middle" class="m">ein Streifen scharf</text>
  <text x="180" y="198" text-anchor="middle" class="m">Ebene liegt auf</text>
  <text x="180" y="212" text-anchor="middle" class="m">dem Boden: alles</text>
  <text x="180" y="226" text-anchor="middle" class="m">vorn bis hinten</text>
  <text x="300" y="198" text-anchor="middle" class="m">Ebene steil:</text>
  <text x="300" y="212" text-anchor="middle" class="m">schmaler Streifen</text>
</svg>
