  <g>
    <line x1="10" y1="100" x2="110" y2="100" class="m"/>
    <path d="M70 100 v-14 h12 M70 86 v-14"/><circle cx="70" cy="66" r="5"/>
    <rect x="26" y="34" width="10" height="7" class="af" stroke="none"/>
    <line x1="36" y1="40" x2="66" y2="64" class="a" stroke-dasharray="3 3"/>
    <text x="60" y="118" text-anchor="middle" class="m">von oben herab</text>
  </g>
  <g>
    <line x1="130" y1="100" x2="230" y2="100" class="m"/>
    <path d="M190 100 v-14 h12 M190 86 v-14"/><circle cx="190" cy="66" r="5"/>
