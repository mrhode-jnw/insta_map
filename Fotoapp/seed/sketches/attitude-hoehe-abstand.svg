  <path d="M32 214 h26 M32 211 v6 M58 211 v6" class="a"/>
  <path d="M32 222 h266 M32 219 v6 M298 219 v6" class="a"/>
  <text x="60" y="240" text-anchor="start" class="m">nah: Erlaubnis oder Übergriff?</text>
  <text x="340" y="254" text-anchor="end" class="m">fern: Respekt oder Desinteresse?</text>
