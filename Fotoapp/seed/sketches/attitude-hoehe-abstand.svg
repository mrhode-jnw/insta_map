  </g>
  <g>
    <line x1="250" y1="100" x2="350" y2="100" class="m"/>
    <path d="M310 100 v-14 h12 M310 86 v-14"/><circle cx="310" cy="66" r="5"/>
    <rect x="266" y="92" width="10" height="7" class="af" stroke="none"/>
