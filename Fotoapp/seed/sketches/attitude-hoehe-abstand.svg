  <line x1="10" y1="136" x2="350" y2="136" class="m" stroke-dasharray="2 4"/>
  <text x="180" y="156" text-anchor="middle" class="h">Abstand = Frage, kein Urteil</text>
  <line x1="20" y1="206" x2="340" y2="206" class="m"/>
  <rect x="20" y="194" width="10" height="7" class="af" stroke="none"/>
  <line x1="60" y1="206" x2="60" y2="186"/><circle cx="60" cy="181" r="4.5"/>
