<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 205" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- three media, three viewing distances -->
  <text x="55" y="16" text-anchor="middle" class="h">Buch</text>
  <text x="180" y="16" text-anchor="middle" class="h">Wand</text>
  <text x="310" y="16" text-anchor="middle" class="h">Handy</text>
  <line x1="5" y1="130" x2="355" y2="130" class="m"/>
  <!-- book: seated reader -->
  <path d="M30 130 v-30 h22" class="m"/>
  <line x1="40" y1="100" x2="40" y2="74"/><circle cx="40" cy="66" r="6"/>
  <path d="M60 92 l14 -6 l14 6" class="a"/>
  <path d="M45 68 L72 88" class="a" stroke-dasharray="2 3"/>
  <!-- wall -->
  <line x1="130" y1="30" x2="130" y2="130" class="m"/>
  <rect x="130" y="52" width="5" height="40" class="af" stroke="none"/>
  <line x1="230" y1="130" x2="230" y2="80"/><circle cx="230" cy="72" r="6"/>
  <path d="M224 72 L136 72" class="a" stroke-dasharray="2 3"/>
  <!-- phone -->
  <line x1="300" y1="130" x2="300" y2="80"/><circle cx="300" cy="72" r="6"/>
  <rect x="318" y="74" width="7" height="13" rx="1.5" class="a"/>
  <path d="M305 74 L318 80" class="a" stroke-dasharray="2 3"/>
  <text x="55" y="150" text-anchor="middle" class="m">≈ 40 cm</text>
  <text x="180" y="150" text-anchor="middle" class="m">≈ 3 m</text>
  <text x="310" y="150" text-anchor="middle" class="m">≈ 30 cm</text>
  <text x="55" y="168" text-anchor="middle">Folge, Doppelseite</text>
  <text x="180" y="168" text-anchor="middle">Raum, Größe</text>
  <text x="310" y="168" text-anchor="middle">klein, Feed</text>
  <text x="180" y="196" text-anchor="middle" class="a">Einheit? Reihenfolge? Abstand?</text>
</svg>
