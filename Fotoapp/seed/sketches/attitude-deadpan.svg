<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <text x="90" y="16" text-anchor="middle" class="h">Dramatisch</text>
  <text x="270" y="16" text-anchor="middle" class="h">Deadpan</text>
  <!-- dramatic: tilted building, low sun, long shadow -->
  <rect x="20" y="28" width="140" height="100"/>
  <path d="M60 118 L72 52 L112 46 L118 118" />
  <path d="M118 118 L160 104" class="a" stroke-width="2"/>
  <circle cx="38" cy="50" r="7" class="a"/>
  <path d="M20 28 L50 28 L20 58 Z M160 28 L130 28 L160 58 Z" class="f" stroke="none"/>
  <path d="M20 118 h140" class="m"/>
  <!-- deadpan: frontal facade, centered, even light -->
  <rect x="200" y="28" width="140" height="100"/>
  <rect x="234" y="50" width="72" height="68"/>
  <path d="M246 62 h14 v12 h-14z M280 62 h14 v12 h-14z M246 88 h14 v12 h-14z M280 88 h14 v12 h-14z" class="m"/>
  <path d="M200 118 h140" class="m"/>
  <path d="M270 28 v6 M270 122 v6" class="a"/>
  <text x="90" y="148" text-anchor="middle" class="m">Schräge, tiefe Sonne,</text>
  <text x="90" y="162" text-anchor="middle" class="m">langer Schatten,</text>
  <text x="90" y="176" text-anchor="middle" class="m">Vignette: urteilt mit</text>
  <text x="210" y="148" class="a">· frontal</text>
  <text x="210" y="162" class="a">· mittlere Distanz</text>
  <text x="210" y="176" class="a">· bedecktes Licht</text>
  <text x="210" y="190" class="a">· zentral, symmetrisch</text>
  <text x="210" y="204" class="a">· alles scharf</text>
  <text x="210" y="218" class="a">· keine Tageszeit</text>
  <text x="180" y="242" text-anchor="middle" class="m">Zurückhaltung lässt das Motiv selbst sprechen.</text>
</svg>
