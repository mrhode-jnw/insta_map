<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <text x="10" y="16" class="h">Statement in vier Schritten</text>
  <rect x="10" y="28" width="80" height="78" rx="6"/><rect x="96" y="28" width="80" height="78" rx="6"/><rect x="182" y="28" width="80" height="78" rx="6" class="a"/><rect x="268" y="28" width="82" height="78" rx="6"/>
  <text x="50" y="48" text-anchor="middle" class="a">1 Was</text><text x="50" y="68" text-anchor="middle" class="m">Gegenstand</text><text x="50" y="82" text-anchor="middle" class="m">und Ort</text>
  <text x="136" y="48" text-anchor="middle" class="a">2 Wie</text><text x="136" y="68" text-anchor="middle" class="m">Methode,</text><text x="136" y="82" text-anchor="middle" class="m">Konstanten,</text><text x="136" y="96" text-anchor="middle" class="m">Zeitraum</text>
  <text x="222" y="48" text-anchor="middle" class="a">3 Warum</text><text x="222" y="68" text-anchor="middle" class="m">die Frage</text><text x="222" y="82" text-anchor="middle" class="m">des Projekts</text>
  <text x="309" y="48" text-anchor="middle" class="a">4 Wofür</text><text x="309" y="68" text-anchor="middle" class="m">Buch, Serie,</text><text x="309" y="82" text-anchor="middle" class="m">Ausstellung</text>
  <!-- in / out -->
  <text x="10" y="134" class="h">Hinein</text>
  <text x="10" y="152">einfache Sätze, einfache Wörter</text>
  <text x="10" y="168">am Bild prüfbar</text>
  <text x="10" y="196" class="h">Nicht hinein</text>
  <path d="M10 210 l8 8 M18 210 l-8 8" class="m"/><text x="26" y="218" class="m">was man fühlen soll</text>
  <path d="M10 226 l8 8 M18 226 l-8 8" class="m"/><text x="26" y="234" class="m">„Ich versuche …“, „Ich hoffe …“</text>
  <path d="M10 242 l8 8 M18 242 l-8 8" class="m"/><text x="26" y="250" class="m">Fachjargon</text>
  <path d="M10 258 l8 8 M18 258 l-8 8" class="m"/><text x="26" y="266" class="m">was ohnehin im Bild steht</text>
</svg>
